<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Тропа Мазаник · Тропами памяти</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#111;
    color:#f4eee2;
}

body{
    min-height:100vh;
    background:
        linear-gradient(rgba(12,12,12,.66),rgba(12,12,12,.82)),
        url("main-background.png") center/cover fixed no-repeat;
}

button,input,select{
    font:inherit;
}

.topbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
    background:rgba(9,9,9,.88);
    border-bottom:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(8px);
    z-index:50;
}

.logo{
    letter-spacing:3px;
    font-weight:bold;
    font-size:14px;
}

.top-actions{
    display:flex;
    gap:8px;
}

.top-btn{
    border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.06);
    color:#eee;
    padding:9px 13px;
    border-radius:8px;
    cursor:pointer;
    transition:.2s;
}

.top-btn:hover{
    background:rgba(255,255,255,.13);
}

.screen{
    min-height:100vh;
    padding:96px 20px 60px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.panel{
    width:min(920px,100%);
    background:rgba(15,15,15,.86);
    border:1px solid rgba(255,255,255,.13);
    border-radius:18px;
    padding:42px;
    box-shadow:0 20px 70px rgba(0,0,0,.45);
}

.kicker{
    color:#c5a96d;
    letter-spacing:4px;
    font-size:13px;
    margin-bottom:12px;
    text-transform:uppercase;
}

h1{
    margin:0 0 16px;
    font-family:Georgia,serif;
    font-size:clamp(34px,6vw,62px);
    line-height:1;
}

h2{
    font-family:Georgia,serif;
    font-size:34px;
    margin:0 0 18px;
}

h3{
    font-family:Georgia,serif;
    font-size:25px;
}

.subtitle{
    color:#c9c3b8;
    font-size:18px;
    line-height:1.6;
}

.story-text{
    color:#e9e3d7;
    font-size:18px;
    line-height:1.8;
    white-space:pre-line;
}

.quote{
    margin:25px 0;
    padding:18px 22px;
    border-left:3px solid #c5a96d;
    background:rgba(255,255,255,.045);
    color:#eee4d2;
    font-family:Georgia,serif;
    font-size:20px;
    line-height:1.6;
}

.choice-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:14px;
    margin-top:28px;
}

.choice{
    text-align:left;
    padding:18px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.055);
    color:#f3eee5;
    cursor:pointer;
    transition:.25s;
}

.choice:hover{
    transform:translateY(-2px);
    background:rgba(255,255,255,.10);
    border-color:rgba(197,169,109,.55);
}

.choice-title{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

.choice-note{
    display:block;
    color:#aaa49b;
    font-size:14px;
    line-height:1.4;
}

.primary{
    display:inline-block;
    margin-top:26px;
    padding:14px 20px;
    border:none;
    border-radius:9px;
    background:#c5a96d;
    color:#18140e;
    font-weight:bold;
    cursor:pointer;
    letter-spacing:.5px;
}

.primary:hover{
    filter:brightness(1.08);
}

.secondary{
    display:inline-block;
    margin-top:14px;
    padding:11px 17px;
    border:1px solid rgba(255,255,255,.18);
    border-radius:9px;
    background:rgba(255,255,255,.05);
    color:#eee;
    cursor:pointer;
}

.dossier{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-top:25px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.field.full{
    grid-column:1/-1;
}

.field label{
    color:#bdb5a7;
    font-size:13px;
}

.field input,
.field select{
    width:100%;
    padding:13px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,.14);
    background:#1a1a1a;
    color:#f5f0e7;
    outline:none;
}

.field input:focus,
.field select:focus{
    border-color:#c5a96d;
}

.small-note{
    margin-top:16px;
    color:#99948b;
    font-size:13px;
    line-height:1.5;
}

.profile-list{
    display:grid;
    gap:12px;
    margin-top:25px;
}

.profile{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding:17px;
    border:1px solid rgba(255,255,255,.13);
    border-radius:10px;
    background:rgba(255,255,255,.045);
}

.profile-info{
    line-height:1.5;
}

.profile-code{
    color:#c5a96d;
    font-weight:bold;
}

.profile-meta{
    color:#aaa;
    font-size:13px;
}

.overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.78);
    z-index:100;
}

.overlay.active{
    display:flex;
}

.modal{
    width:min(850px,100%);
    max-height:88vh;
    overflow:auto;
    background:#151515;
    border:1px solid rgba(255,255,255,.16);
    border-radius:16px;
    padding:30px;
}

.modal h2{
    font-size:28px;
}

.diary-entry{
    padding:15px 0;
    border-bottom:1px solid rgba(255,255,255,.09);
}

.diary-entry strong{
    color:#c5a96d;
}

.stat-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:24px;
}

.stat{
    background:rgba(255,255,255,.05);
    padding:15px;
    border-radius:9px;
    text-align:center;
}

.stat b{
    display:block;
    font-size:24px;
    color:#c5a96d;
}

.fade{
    animation:fade .45s ease;
}

@keyframes fade{
    from{opacity:0;transform:translateY(8px)}
    to{opacity:1;transform:translateY(0)}
}

@media(max-width:700px){
    .panel{
        padding:26px 20px;
    }

    .choice-grid,
    .dossier,
    .stat-grid{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }

    .topbar{
        padding:0 12px;
    }

    .logo{
        font-size:11px;
        letter-spacing:2px;
    }

    .top-btn{
        padding:8px 9px;
        font-size:12px;
    }
}
</style>
</head>

<body>

<div class="topbar">
    <div class="logo">▲ ТРОПАМИ ПАМЯТИ · ПОДПОЛЬЕ</div>

    <div class="top-actions">
        <button class="top-btn" onclick="openDossier()">📜 ДОСЬЕ</button>
        <button class="top-btn" onclick="openDiary()">📖 ДНЕВНИК</button>
        <button class="top-btn" onclick="goHome()">🏠 ГЛАВНАЯ</button>
    </div>
</div>

<div id="app"></div>

<!-- МОДАЛЬНОЕ ОКНО ДОСЬЕ -->
<div id="dossierOverlay" class="overlay">
    <div class="modal">
        <div id="dossierContent"></div>
    </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО ДНЕВНИКА -->
<div id="diaryOverlay" class="overlay">
    <div class="modal">
        <h2>📖 Дневник</h2>
        <div id="diaryContent"></div>
        <button class="secondary" onclick="closeOverlays()">Закрыть</button>
    </div>
</div>

<script>

/* =========================================================
   СОСТОЯНИЕ ИГРЫ
========================================================= */

let hero = null;

let game = {
    scene: 0,
    trust: 0,
    caution: 0,
    courage: 0,
    evidence: 0,
    diary: [],
    discoveries: [],
    finished: false
};

const STORAGE_KEY = "tropami_mazanik_profiles";

/* =========================================================
   ПРОФИЛИ
========================================================= */

function getProfiles(){
    try{
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    }catch(e){
        return [];
    }
}

function saveProfiles(profiles){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(profiles));
}

function saveCurrent(){
    if(!hero) return;

    hero.game = game;

    const profiles = getProfiles();

    const index = profiles.findIndex(p => p.id === hero.id);

    if(index >= 0){
        profiles[index] = hero;
    }else{
        profiles.push(hero);
    }

    saveProfiles(profiles);
}

/* =========================================================
   ЭКРАНЫ
========================================================= */

function render(html){
    document.getElementById("app").innerHTML =
        `<div class="screen fade">${html}</div>`;
}

function goHome(){
    window.location.href = "index.html";
}

/* =========================================================
   НАЧАЛО
========================================================= */

function start(){

    const profiles = getProfiles();

    if(profiles.length){
        showProfileChoice();
    }else{
        showIntro();
    }
}

function showIntro(){

    render(`
        <div class="panel">

            <div class="kicker">ВТОРАЯ ТРОПА · ПОДПОЛЬЕ</div>

            <h1>Город молчит</h1>

            <div class="subtitle">
                Минск. 1943 год.
            </div>

            <div class="quote">
                «В городе опасно не только то, что ты делаешь.
                Опасно даже то, кто тебя знает».
            </div>

            <div class="story-text">
Ты не знаешь, кто написал эту записку.

Ты не знаешь, откуда человек, который передал её, знает твоё имя.

И пока ты стоишь в полутёмном подъезде, тебе кажется,
что самое разумное — положить листок обратно.

Но в оккупированном городе иногда именно бездействие
становится выбором.
            </div>

            <button class="primary" onclick="showDossierIntro()">
                НАЧАТЬ ИСТОРИЮ
            </button>

        </div>
    `);
}

/* =========================================================
   ДОСЬЕ
========================================================= */

function showDossierIntro(){

    render(`
        <div class="panel">

            <div class="kicker">ЛИЧНОЕ ДОСЬЕ</div>

            <h2>Создай своего героя</h2>

            <div class="story-text">
Перед тем как войти в историю, тебе понадобится новое имя.

Это вымышленный герой.

Используй только придуманные данные.
Не вводи настоящий адрес, реальные сведения о родственниках
или другую личную информацию.
            </div>

            <button class="primary" onclick="showDossierForm()">
                ЗАПОЛНИТЬ ДОСЬЕ
            </button>

        </div>
    `);
}

function showDossierForm(existing=null){

    render(`
        <div class="panel">

            <div class="kicker">ЛИЧНОЕ ДОСЬЕ</div>

            <h2>Заполни досье своего героя</h2>

            <div class="dossier">

                <div class="field">
                    <label>Имя</label>
                    <input id="firstName" value="${existing?.firstName || ""}">
                </div>

                <div class="field">
                    <label>Фамилия</label>
                    <input id="lastName" value="${existing?.lastName || ""}">
                </div>

                <div class="field">
                    <label>Возраст</label>
                    <input id="age" type="number" min="12" max="80"
                           value="${existing?.age || ""}">
                </div>

                <div class="field">
                    <label>Пол</label>
                    <select id="gender">
                        <option value="">Выбери</option>
                        <option ${existing?.gender==="Женский"?"selected":""}>Женский</option>
                        <option ${existing?.gender==="Мужской"?"selected":""}>Мужской</option>
                    </select>
                </div>

                <div class="field">
                    <label>Родной город / деревня</label>
                    <input id="homePlace" value="${existing?.homePlace || ""}">
                </div>

                <div class="field">
                    <label>Район / область</label>
                    <input id="region" value="${existing?.region || ""}">
                </div>

                <div class="field">
                    <label>Имя близкого человека</label>
                    <input id="relativeName" value="${existing?.relativeName || ""}">
                </div>

                <div class="field">
                    <label>Кем он тебе приходится?</label>
                    <input id="relativeRole" value="${existing?.relativeRole || ""}">
                </div>

                <div class="field full">
                    <label>Как тебя узнать? Особая примета</label>
                    <input id="specialMark" value="${existing?.specialMark || ""}">
                </div>

                <div class="field full">
                    <label>Под каким именем тебя будут знать товарищи?</label>
                    <input id="codeName" value="${existing?.codeName || ""}">
                </div>

            </div>

            <div class="small-note">
                Все данные — часть игры. Используй вымышленные сведения.
            </div>

            <button class="primary" onclick="createHero()">
                💾 СОХРАНИТЬ ДОСЬЕ
            </button>

        </div>
    `);
}

function createHero(){

    const firstName = document.getElementById("firstName").value.trim();
    const lastName = document.getElementById("lastName").value.trim();
    const age = document.getElementById("age").value.trim();
    const gender = document.getElementById("gender").value;
    const homePlace = document.getElementById("homePlace").value.trim();
    const region = document.getElementById("region").value.trim();
    const relativeName = document.getElementById("relativeName").value.trim();
    const relativeRole = document.getElementById("relativeRole").value.trim();
    const specialMark = document.getElementById("specialMark").value.trim();
    const codeName = document.getElementById("codeName").value.trim();

    if(
        !firstName ||
        !lastName ||
        !age ||
        !gender ||
        !homePlace ||
        !region ||
        !relativeName ||
        !relativeRole ||
        !specialMark ||
        !codeName
    ){
        alert("Заполни все поля досье.");
        return;
    }

    hero = {
        id:"hero_" + Date.now(),
        firstName,
        lastName,
        age,
        gender,
        homePlace,
        region,
        relativeName,
        relativeRole,
        specialMark,
        codeName,
        path:"Подпольщики",
        mentor:"Елена Мазаник · Мария Осипова · Надежда Троян",
        game:{
            scene:0,
            trust:0,
            caution:0,
            courage:0,
            evidence:0,
            diary:[],
            discoveries:[],
            finished:false
        }
    };

    game = hero.game;

    saveCurrent();

    storyScene0();
}

function showProfileChoice(){

    const profiles = getProfiles();

    let html = `
        <div class="panel">

            <div class="kicker">АРХИВ</div>

            <h2>Выбери своё досье</h2>

            <div class="story-text">
Ты уже создавал героя.
Можно продолжить его историю или начать новую.
            </div>

            <div class="profile-list">
    `;

    profiles.forEach(p=>{

        const progress = p.game?.finished
            ? "История завершена"
            : "История продолжается";

        html += `
            <div class="profile">

                <div class="profile-info">
                    <div class="profile-code">
                        📜 ${escapeHtml(p.codeName)}
                    </div>

                    <div>
                        ${escapeHtml(p.firstName)}
                        ${escapeHtml(p.lastName)},
                        ${escapeHtml(String(p.age))}
                    </div>

                    <div class="profile-meta">
                        Подпольщики · ${progress}
                    </div>
                </div>

                <button class="primary"
                        style="margin:0"
                        onclick="loadProfile('${p.id}')">
                    ПРОДОЛЖИТЬ
                </button>

            </div>
        `;
    });

    html += `
            </div>

            <button class="secondary"
                    onclick="showDossierIntro()">
                Создать новое досье
            </button>

        </div>
    `;

    render(html);
}

function loadProfile(id){

    const profiles = getProfiles();
    const found = profiles.find(p=>p.id===id);

    if(!found) return;

    hero = found;
    game = found.game || {
        scene:0,
        trust:0,
        caution:0,
        courage:0,
        evidence:0,
        diary:[],
        discoveries:[],
        finished:false
    };

    if(game.finished){
        showEnding();
    }else{
        continueStory();
    }
}

/* =========================================================
   ИСТОРИЯ
========================================================= */

function continueStory(){

    switch(game.scene){

        case 0: storyScene0(); break;
        case 1: storyScene1(); break;
        case 2: storyScene2(); break;
        case 3: storyScene3(); break;
        case 4: storyScene4(); break;
        case 5: storyScene5(); break;
        case 6: storyScene6(); break;
        case 7: storyScene7(); break;
        case 8: storyScene8(); break;
        case 9: storyScene9(); break;
        case 10: storyScene10(); break;
        default: showEnding();
    }
}

function nextScene(){

    game.scene++;
    saveCurrent();
    continueStory();
}

function addDiary(text){

    game.diary.push({
        date:new Date().toLocaleDateString("ru-RU"),
        text
    });
}

function addDiscovery(text){

    if(!game.discoveries.includes(text)){
        game.discoveries.push(text);
    }
}

/* =========================================================
   СЦЕНА 0
========================================================= */

function storyScene0(){

    render(`
        <div class="panel">

            <div class="kicker">МИНСК · 1943</div>

            <h2>Записка</h2>

            <div class="story-text">
Вечер.

Ты идёшь домой привычной дорогой.

После наступления темноты город меняется.
Окна закрыты. На улице почти нет людей.
Каждый звук кажется слишком громким.

У подъезда ты замечаешь человека.

Он не смотрит на тебя.

Когда ты проходишь мимо, его рука едва заметно касается твоей руки.

В ладони оказывается сложенный клочок бумаги.

Ты заходишь в подъезд.

Поднимаешься на несколько ступеней.

И только тогда разворачиваешь записку.
            </div>

            <div class="quote">
«Завтра. После шестого удара часов.
Не приходи один».
            </div>

            <div class="story-text">
Подписи нет.

Но внизу стоит маленький знак.

Ты видел его раньше.

На другом листке.

Только вот где?
            </div>

            <div class="choice-grid">

                <button class="choice" onclick="
                    game.caution++;
                    addDiary('Я решил не спешить. Сначала нужно понять, откуда взялась записка.');
                    addDiscovery('Таинственная записка');
                    nextScene();
                ">
                    <span class="choice-title">Спрятать записку и сначала проверить знак</span>
                    <span class="choice-note">Осторожность может сохранить жизнь.</span>
                </button>

                <button class="choice" onclick="
                    game.courage++;
                    addDiary('Я решил прийти на встречу. Иногда слишком долгие сомнения опаснее риска.');
                    addDiscovery('Таинственная записка');
                    nextScene();
                ">
                    <span class="choice-title">Принять приглашение</span>
                    <span class="choice-note">Если это зовут товарища, нельзя заставлять его ждать.</span>
                </button>

            </div>

        </div>
    `);
}

/* =========================================================
   СЦЕНА 1
========================================================= */

function storyScene1(){

    render(`
        <div class="panel">

            <div class="kicker">ГЛАВА I</div>

            <h2>Человек у окна</h2>

            <div class="story-text">
На следующий вечер ты приходишь к назначенному месту.

Сначала кажется, что никого нет.

Потом в окне напротив загорается свет.

Один раз.

Через несколько секунд — снова.

Ты понимаешь: это условный знак.

Из тёмного подъезда выходит женщина.

Она не представляется.

Она смотрит на тебя несколько секунд, будто пытается решить,
можно ли тебе доверять.
            </div>

            <div class="quote">
— Здесь много людей, которые умеют говорить правильные слова.
Но нам нужны те, кто умеет молчать.
            </div>

            <div class="story-text">
Она протягивает тебе маленький свёрток.

— Отнесёшь это человеку на соседней улице.

— Что внутри?

Женщина чуть улыбается.

— Если тебе действительно нужно это знать,
значит, пока рано.
            </div>

            <div class="choice-grid">

                <button class="choice" onclick="
                    game.caution++;
                    game.trust++;
                    addDiary('Я не стал задавать лишних вопросов.');
                    nextScene();
                ">
                    <span class="choice-title">Взять свёрток и ничего не спрашивать</span>
                    <span class="choice-note">В подполье доверие начинается с умения хранить чужую тайну.</span>
                </button>

                <button class="choice" onclick="
                    game.evidence++;
                    addDiary('Я попросил хотя бы объяснить, кому именно я должен передать свёрток.');
                    nextScene();
                ">
                    <span class="choice-title">Попросить объяснить хотя бы цель задания</span>

========================================================= */

function openDiary(){

    if(!hero){
        alert("Сначала создай героя.");
        return;
    }

    let html = "";

    if(!game.diary.length){

        html = `
            <div class="story-text">
                Пока здесь пусто.
                Твой дневник начнётся вместе с историей.
            </div>
        `;

    }else{

        game.diary.forEach((entry,index)=>{

            html += `
                <div class="diary-entry">
                    <strong>Запись ${index+1} · ${escapeHtml(entry.date)}</strong>
                    <div class="story-text">
                        ${escapeHtml(entry.text)}
                    </div>
                </div>
            `;
        });
    }

    document.getElementById("diaryContent").innerHTML = html;

    document.getElementById("diaryOverlay")
        .classList.add("active");
}

function showDiaryPage(){
    openDiary();
}

function closeOverlays(){
    document.querySelectorAll(".overlay")
        .forEach(x=>x.classList.remove("active"));
}

/* =========================================================
   БЕЗОПАСНЫЙ ВЫВОД ТЕКСТА
========================================================= */

function escapeHtml(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}
