<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тропа Коржа — Тропами памяти</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#101512}
body{color:#f3ead9;font-family:Georgia,"Times New Roman",serif}
.game{min-height:100vh;overflow:hidden;background:linear-gradient(to bottom,rgba(10,15,13,.1),rgba(10,15,13,.22)),url("korzh-background.png") center/cover no-repeat}
.topbar{min-height:76px;display:flex;align-items:center;gap:20px;padding:10px 24px;background:rgba(19,24,22,.92);border-bottom:2px solid rgba(231,215,183,.45);position:relative;z-index:5}
.brand{flex:1;color:#1d1d19;background:#e4d2ad;padding:13px 20px;font-weight:700;font-size:clamp(18px,2vw,27px);letter-spacing:.06em;clip-path:polygon(1% 8%,98% 0,100% 88%,3% 100%,0 24%)}
.nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
button{cursor:pointer;font-family:Georgia,"Times New Roman",serif}
.nav button,.continue{border:0;color:#211f19;background:#e4d2ad;font-weight:700;box-shadow:0 2px 0 rgba(0,0,0,.25);transition:.15s}
.nav button{padding:12px 14px;border-radius:5px;font-size:14px}
button:hover{filter:brightness(1.08);transform:translateY(-1px)}
.content{min-height:calc(100vh - 76px);display:flex;align-items:flex-end;padding:0 6vw 34px}
.dialogue{width:min(1100px,100%);margin:auto;padding:28px 34px 24px;background:rgba(13,21,20,.91);border:2px solid rgba(228,210,173,.65);border-radius:7px;box-shadow:0 12px 35px rgba(0,0,0,.45);animation:appear .5s ease}
.name{display:inline-block;margin-top:-47px;margin-bottom:15px;padding:10px 30px;color:#211f19;background:#e4d2ad;font-size:20px;font-weight:700;clip-path:polygon(2% 7%,97% 0,100% 88%,3% 100%,0 20%)}
.chapter{color:#d9c69f;font-size:13px;letter-spacing:.14em;margin-bottom:12px}
.text{font-size:clamp(18px,2vw,25px);line-height:1.55;max-width:850px;min-height:82px}
.continue{display:block;margin:20px 0 0 auto;padding:13px 24px;font-size:15px;border-radius:4px}
.toast{position:fixed;top:92px;right:24px;z-index:10;max-width:330px;padding:14px 17px;background:rgba(19,24,22,.94);border:1px solid #cdbd9d;color:#f3ead9;border-radius:5px;opacity:0;transform:translateY(-8px);pointer-events:none;transition:.25s}
.toast.show{opacity:1;transform:translateY(0)}
@keyframes appear{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:760px){.topbar{padding:8px 10px;flex-direction:column;gap:8px}.brand{width:100%;text-align:center;font-size:19px}.nav{justify-content:center}.nav button{padding:9px 10px;font-size:12px}.content{min-height:calc(100vh - 140px);padding:0 12px 16px}.dialogue{padding:23px 18px 18px}.name{margin-top:-41px;font-size:16px;padding:9px 18px}.text{font-size:18px}.continue{width:100%}}
</style>
</head>
<body>
<main class="game">
<header class="topbar">
<div class="brand">🌲 ТРОПАМИ ПАМЯТИ</div>
<nav class="nav">
<button onclick="notice('Досье героя откроем следующим шагом.')">📜 ДОСЬЕ</button>
<button onclick="notice('Дневник пока пуст — он заполнится по ходу истории.')">📖 ДНЕВНИК</button>
<button onclick="notice('Карта станет интерактивной в следующей версии.')">🗺 КАРТА</button>
<button onclick="notice('Историческая энциклопедия скоро будет здесь.')">📚 ИСТОРИЯ</button>
<button onclick="notice('Настройки добавим после основного интерфейса.')">⚙ МЕНЮ</button>
</nav>
</header>
<section class="content">
<div class="dialogue" id="dialogue">
<div class="name" id="speaker">ТВОЙ ДНЕВНИК</div>
<div class="chapter" id="chapter">ПРОЛОГ</div>
<div class="text" id="text">22 июня 1941 года.<br><br>Война пришла в Беларусь.<br>Утро начиналось как обычно. Но этот день изменил жизнь миллионов людей.</div>
<button class="continue" id="continue">ПРОДОЛЖИТЬ →</button>
</div>
</section>
<div class="toast" id="toast"></div>
</main>
<script>
const scenes=[
{chapter:"ПРОЛОГ",speaker:"ТВОЙ ДНЕВНИК",text:"22 июня 1941 года.<br><br>Война пришла в Беларусь.<br>Утро начиналось как обычно. Но этот день изменил жизнь миллионов людей."},
{chapter:"ГЛАВА I — КОГДА НАЧАЛАСЬ ВОЙНА",speaker:"ТВОЙ ДНЕВНИК",text:"Ты ещё не знаешь, чем закончится эта война.<br><br>Ты знаешь только одно: теперь всё будет иначе."},
{chapter:"ГЛАВА II — ПЕРЕД ДОРОГОЙ",speaker:"ВАСИЛИЙ ЗАХАРОВИЧ КОРЖ",text:"В разведке нельзя додумывать.<br><br>Говорить нужно только то, что действительно видел."}
];
let index=0;
function render(){const s=scenes[index];document.getElementById("chapter").textContent=s.chapter;document.getElementById("speaker").textContent=s.speaker;document.getElementById("text").innerHTML=s.text;const d=document.getElementById("dialogue");d.style.animation="none";void d.offsetWidth;d.style.animation="appear .5s ease";document.getElementById("continue").textContent=index===scenes.length-1?"НАЧАТЬ ИСТОРИЮ →":"ПРОДОЛЖИТЬ →"}
document.getElementById("continue").onclick=()=>{if(index<scenes.length-1){index++;render()}else notice("Первая сцена готова. Следующим шагом добавим настоящее Досье.")};
function notice(message){const t=document.getElementById("toast");t.textContent=message;t.classList.add("show");clearTimeout(window.timer);window.timer=setTimeout(()=>t.classList.remove("show"),2600)}
</script>
</body>
</html>
