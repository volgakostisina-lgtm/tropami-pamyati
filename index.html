<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Главная — Тропами памяти</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; min-height: 100%; }
body { font-family: Georgia, "Times New Roman", serif; background: #101512; color: #f1eadc; }

.game {
    min-height: 100vh;
    background-image: linear-gradient(rgba(10, 15, 13, 0.20), rgba(10, 15, 13, 0.38)), url("main-background.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: flex;
    flex-direction: column;
}

/* ВЕРХНЯЯ ПАНЕЛЬ */
.top-bar {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 28px;
    background: rgba(10, 15, 13, 0.72);
    border-bottom: 1px solid rgba(230, 216, 190, 0.18);
}

.top-links {
    display: flex;
    align-items: center;
    gap: 22px;
}

.top-link {
    color: #e8dfcf;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 15px;
    text-decoration: none;
    transition: color 0.2s ease;
}

.top-link:hover, .top-link.active {
    color: #d6b77c;
}

/* Кнопка управления музыкой */
.music-button {
    padding: 8px 14px;
    border: 1px solid rgba(230, 216, 190, 0.45);
    background: rgba(30, 35, 30, 0.85);
    color: #f1eadc;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 14px;
    cursor: pointer;
    border-radius: 4px;
    transition: background 0.2s ease, border-color 0.2s ease;
}
.music-button:hover {
    background: rgba(55, 58, 47, 0.95);
    border-color: rgba(230, 216, 190, 0.75);
}

/* КОНТЕЙНЕР ДЛЯ ВАШИХ ССЫЛОК/КАРТОЧЕК */
.main-content {
    padding: 60px 20px;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* Стили для ваших блоков/карточек на главной (если они текстовые или кнопочные) */
.index-container {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    text-align: center;
}
</style>
</head>
<body>

<div class="game">

    <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
    <header class="top-bar">
        <nav class="top-links">
            <a href="index.html" class="top-link active">Главная</a>
            <a href="opisanie.html" class="top-link">Описание проекта</a>
        </nav>
        <button class="music-button" id="musicButton" type="button">
            ♫ Включить мелодию
        </button>
    </header>

    <!-- СКРЫТЫЙ АУДИОПЛЕЕР -->
    <audio id="bgMusic" src="music.mp3" preload="auto" loop></audio>

    <!-- ОСНОВНОЙ БЛОК ГЛАВНОЙ СТРАНИЦЫ -->
    <main class="main-content">
        <div class="index-container">
            <!-- 
              ЕСЛИ У ВАС ТУТ БЫЛИ ССЫЛКИ ИЛИ КАРТОЧКИ (на партизан, подпольщиков и т.д.), 
              вставьте их сюда обратно. Например:
            -->
            <div style="display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;">
                <a href="partisans.html" style="padding: 20px 40px; background: rgba(16, 21, 18, 0.88); border: 1px solid rgba(230, 216, 190, 0.3); color: #f1eadc; text-decoration: none; border-radius: 8px; font-size: 18px;">Партизаны</a>
                <a href="underground.html" style="padding: 20px 40px; background: rgba(16, 21, 18, 0.88); border: 1px solid rgba(230, 216, 190, 0.3); color: #f1eadc; text-decoration: none; border-radius: 8px; font-size: 18px;">Подполье</a>
                <a href="test.html" style="padding: 20px 40px; background: rgba(16, 21, 18, 0.88); border: 1px solid rgba(230, 216, 190, 0.3); color: #f1eadc; text-decoration: none; border-radius: 8px; font-size: 18px;">Тест</a>
            </div>
        </div>
    </main>

</div>

<script>
    const music = document.getElementById("bgMusic");
    const musicButton = document.getElementById("musicButton");

    // Восстанавливаем состояние музыки при загрузке страницы
    window.addEventListener("DOMContentLoaded", () => {
        const musicPlaying = localStorage.getItem("musicPlaying") === "true";
        const musicCurrentTime = parseFloat(localStorage.getItem("musicCurrentTime")) || 0;

        music.currentTime = musicCurrentTime;

        if (musicPlaying) {
            music.play().then(() => {
                musicButton.textContent = "♫ Выключить мелодию";
            }).catch(() => {
                localStorage.setItem("musicPlaying", "false");
            });
        }
    });

    // Сохраняем текущую секунду трека
    music.addEventListener("timeupdate", () => {
        localStorage.setItem("musicCurrentTime", music.currentTime);
    });

    // Управление кнопкой
    musicButton.addEventListener("click", function () {
        if (music.paused) {
            music.play().then(() => {
                musicButton.textContent = "♫ Выключить мелодию";
                localStorage.setItem("musicPlaying", "true");
            }).catch(e => {
                console.log("Ошибка воспроизведения:", e);
            });
        } else {
            music.pause();
            musicButton.textContent = "♫ Выключить мелодию";
            localStorage.setItem("musicPlaying", "false");
        }
    });
</script>

</body>
</html>
