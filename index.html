<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тропами памяти</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; min-height: 100%; height: 100%; }
body { font-family: Georgia, "Times New Roman", serif; background: #101512; color: #f1eadc; }

/* Главный контейнер с фоном */
.game-wrapper {
    min-height: 100vh;
    background-image: linear-gradient(rgba(10, 15, 13, 0.20), rgba(10, 15, 13, 0.38)), url("main-background.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    display: flex;
    flex-direction: column;
}

/* Верхняя панель управления */
.top-bar {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 28px;
    background: rgba(10, 15, 13, 0.82);
    border-bottom: 1px solid rgba(230, 216, 190, 0.18);
    position: sticky;
    top: 0;
    z-index: 100;
}

.nav-links {
    display: flex;
    gap: 20px;
}

.nav-link {
    color: #e8dfcf;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 15px;
    text-decoration: none;
    cursor: pointer;
    transition: color 0.2s ease;
}

.nav-link:hover, .nav-link.active {
    color: #d6b77c;
}

.music-button {
    padding: 8px 14px;
    border: 1px solid rgba(230, 216, 190, 0.45);
    background: rgba(30, 35, 30, 0.85);
    color: #f1eadc;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 14px;
    cursor: pointer;
    border-radius: 4px;
    transition: background 0.2s ease;
}

.music-button:hover {
    background: rgba(55, 58, 47, 0.95);
}

/* Окно для отображения страниц (iframe) */
.content-frame {
    width: 100%;
    flex: 1;
    border: none;
    min-height: calc(100vh - 65px);
}
</style>
</head>
<body>

<div class="game-wrapper">

    <!-- ВЕРХНЕЕ МЕНЮ И КНОПКА МУЗЫКИ -->
    <header class="top-bar">
        <nav class="nav-links">
            <a onclick="loadPage('main_content.html')" class="nav-link active" id="link-main">Главная</a>
            <a onclick="loadPage('opisanie.html')" class="nav-link" id="link-opisanie">Описание проекта</a>
        </nav>
        
        <button class="music-button" id="musicButton" type="button">
            ♫ Включить мелодию
        </button>
    </header>

    <!-- АУДИОПЛЕЕР (играет беспрерывно) -->
    <audio id="bgMusic" src="music.mp3" loop preload="auto"></audio>

    <!-- ИНТЕРАКТИВНОЕ ОКНО СТРАНИЦ -->
    <iframe id="siteFrame" class="content-frame" src="main_content.html"></iframe>

</div>

<script>
    // Логика переключения страниц без перезагрузки всего сайта
    function loadPage(pageUrl) {
        document.getElementById('siteFrame').src = pageUrl;
        
        // Подсветка активной ссылки в меню
        document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
        if(pageUrl === 'opisanie.html') {
            document.getElementById('link-opisanie').classList.add('active');
        } else {
            document.getElementById('link-main').classList.add('active');
        }
    }

    // Управление непрерывной музыкой
    const music = document.getElementById("bgMusic");
    const musicButton = document.getElementById("musicButton");

    musicButton.addEventListener("click", function () {
        if (music.paused) {
            music.play().then(() => {
                musicButton.textContent = "♫ Выключить мелодию";
            }).catch(e => {
                console.log("Ошибка воспроизведения:", e);
            });
        } else {
            music.pause();
            musicButton.textContent = "♫ Включить мелодию";
        }
    });
</script>

</body>
</html>
