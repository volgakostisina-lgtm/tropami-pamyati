```html
<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Тропами памяти</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    background: #101512;
    color: #f1eadc;
}

.game {
    min-height: 100vh;

    background-image:
        linear-gradient(
            rgba(10, 15, 13, 0.20),
            rgba(10, 15, 13, 0.38)
        ),
        url("main-background.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    display: flex;
    flex-direction: column;
}

/* ЦЕНТРАЛЬНАЯ ЧАСТЬ */

.main {
    flex: 1;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    padding: 45px 20px 70px;
    text-align: center;
}

/* ВСТУПИТЕЛЬНЫЙ БЛОК */

.intro {
    max-width: 760px;
    width: 100%;

    padding: 32px 40px 36px;

    background: rgba(12, 17, 15, 0.72);

    border: 1px solid rgba(230, 216, 190, 0.18);

    box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.35);

    backdrop-filter: blur(3px);
}

.kicker {
    font-size: 15px;
    letter-spacing: 4px;
    text-transform: uppercase;

    color: #cfc3ad;

    margin-bottom: 16px;
}

.years {
    margin-top: 10px;

    font-size: 26px;
    letter-spacing: 4px;

    color: #d6b77c;
}

.description {
    margin: 20px auto 0;

    max-width: 610px;

    font-size: 16px;
    line-height: 1.8;

    color: #cfc7b9;
}

/* ДВА ПУТИ СОПРОТИВЛЕНИЯ */

.paths {
    margin-top: 32px;

    width: min(900px, 100%);

    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 18px;
}

.path-button {
    min-height: 250px;

    border: 1px solid rgba(235, 225, 205, 0.35);

    background: rgba(16, 21, 18, 0.84);

    color: #f1eadc;

    font-family: Georgia, "Times New Roman", serif;

    cursor: pointer;

    padding: 25px 20px;

    transition:
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease;

    box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.28);
}

.path-button:hover {
    transform: translateY(-3px);

    background: rgba(25, 31, 27, 0.94);

    border-color: rgba(235, 225, 205, 0.65);
}

.path-icon {
    display: flex;
    align-items: center;
    justify-content: center;

    height: 120px;
    margin-bottom: 12px;
}

.path-icon img {
    width: 110px;
    height: 110px;

    object-fit: contain;
    display: block;

    filter:
        drop-shadow(0 4px 8px rgba(0, 0, 0, 0.45));

    transition: transform 0.25s ease;
}

.path-button:hover .path-icon img {
    transform: scale(1.05);
}

.path-title {
    display: block;

    font-size: 22px;
    letter-spacing: 2px;

    text-transform: uppercase;
}

.path-text {
    display: block;

    margin-top: 7px;

    font-size: 14px;
    color: #c8c0b2;

    line-height: 1.4;
}

/* КНОПКА ТЕСТА */

.test-button {
    margin-top: 18px;

    min-width: 360px;

    padding: 17px 30px;

    border: 1px solid rgba(230, 216, 190, 0.55);

    background: rgba(49, 48, 39, 0.94);

    color: #f2eadb;

    font-family: Georgia, "Times New Roman", serif;

    font-size: 17px;
    letter-spacing: 2px;

    cursor: pointer;

    text-transform: uppercase;

    transition:
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease;
}

.test-button:hover {
    transform: translateY(-2px);

    background: rgba(67, 64, 50, 0.97);

    border-color: rgba(240, 229, 207, 0.8);
}

/* ССЫЛКА НА ОПИСАНИЕ ПРОЕКТА */

.bottom-description-link {
    display: inline-block;

    margin-top: 18px;
    padding: 12px 28px;

    font-size: 15px;
    letter-spacing: 1px;

    color: #e8dfcf;

    text-decoration: none;

    font-family: Georgia, "Times New Roman", serif;

    background: rgba(12, 17, 15, 0.72);

    border: 1px solid rgba(230, 216, 190, 0.4);

    box-shadow:
        0 6px 18px rgba(0, 0, 0, 0.25);

    transition: all 0.25s ease;
}

.bottom-description-link:hover {
    color: #d6b77c;

    background: rgba(35, 38, 30, 0.9);

    border-color: rgba(214, 183, 124, 0.8);

    transform: translateY(-2px);
}

/* МОБИЛЬНАЯ ВЕРСИЯ */

@media (max-width: 700px) {

    .main {
        padding: 28px 14px 55px;
    }

    .intro {
        padding: 25px 20px 28px;
    }

    .kicker {
        font-size: 12px;
        letter-spacing: 2px;
    }

    .years {
        font-size: 21px;
        letter-spacing: 2px;
    }

    .description {
        font-size: 15px;
    }

    .paths {
        grid-template-columns: 1fr;
    }

    .path-button {
        min-height: 240px;
    }

    .path-icon {
        height: 105px;
    }

    .path-icon img {
        width: 95px;
        height: 95px;
    }

    .test-button {
        min-width: 0;
        width: 100%;
    }

    .bottom-description-link {
        font-size: 14px;
        padding: 12px 18px;
    }
}

</style>
</head>

<body>

<div class="game">

    <!-- ФОНОВАЯ МУЗЫКА -->

    <audio
        id="bgMusic"
        src="music.mp3"
        autoplay
        loop
        preload="auto">
    </audio>

    <!-- ЦЕНТРАЛЬНАЯ ЧАСТЬ -->

    <main class="main">

        <!-- НАЗВАНИЕ И ОПИСАНИЕ ЛОНГРИДА -->

        <section class="intro">

            <div class="kicker">
                Интерактивный исторический лонгрид
            </div>

            <div class="years">
                ТРОПАМИ ПАМЯТИ
            </div>

            <div class="description">
                «Тропами памяти» — интерактивный
                историко-образовательный веб-проект,
                посвящённый партизанскому и подпольному
                движению в Беларуси в годы Великой
                Отечественной войны (1941–1944).
            </div>

        </section>

        <!-- ДВА ПУТИ СОПРОТИВЛЕНИЯ -->

        <div class="paths">

            <!-- ПАРТИЗАНЫ -->

            <button
                class="path-button"
                onclick="window.location.href='partisans.html'">

                <span class="path-icon">

                    <img
                        src="znak-partizany.png"
                        alt="Знак партизан">

                </span>

                <span class="path-title">
                    Партизаны
                </span>

                <span class="path-text">
                    Лес, разведка, рейды,
                    командная работа и борьба
                    на оккупированной территории.
                </span>

            </button>

            <!-- ПОДПОЛЬЩИКИ -->

            <button
                class="path-button"
                onclick="window.location.href='underground.html'">

                <span class="path-icon">

                    <img
                        src="znak-podpolshchiki.png"
                        alt="Знак подпольщиков">

                </span>

                <span class="path-title">
                    Подпольщики
                </span>

                <span class="path-text">
                    Конспирация, связь,
                    информация, осторожность
                    и сопротивление в оккупации.
                </span>

            </button>

        </div>

        <!-- КНОПКА ТЕСТА -->

        <button
            class="test-button"
            onclick="window.location.href='test.html'">

            ОПРЕДЕЛИТЬ СВОЙ ПУТЬ

        </button>

        <!-- ОПИСАНИЕ ПРОЕКТА -->

        <a
            href="opisanie.html"
            class="bottom-description-link">

            О проекте | История, оживающая на экране

        </a>

    </main>

</div>

<!-- ЗАПУСК ФОНОВОЙ МУЗЫКИ -->

<script>

const music = document.getElementById('bgMusic');

async function startMusic() {

    try {

        await music.play();

        // Музыка успешно запущена.
        // Удаляем обработчики повторного запуска.

        document.removeEventListener(
            'pointerdown',
            startMusic,
            true
        );

        document.removeEventListener(
            'keydown',
            startMusic,
            true
        );

    } catch (error) {

        // Если браузер заблокировал автозапуск,
        // повторяем попытку при первом действии посетителя.

    }

}

// Первая попытка при загрузке страницы

document.addEventListener(
    'DOMContentLoaded',
    startMusic
);

// Повторная попытка при первом касании или нажатии

document.addEventListener(
    'pointerdown',
    startMusic,
    true
);

// Повторная попытка при нажатии клавиши

document.addEventListener(
    'keydown',
    startMusic,
    true
);

</script>

</body>
</html>
