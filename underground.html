<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Тропа подпольщиков · Тропами памяти</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: Georgia, "Times New Roman", serif;
    color: #eee;
}

body {
    background:
        linear-gradient(rgba(8,10,12,.72), rgba(8,10,12,.82)),
        url("main-background.png") center / cover fixed no-repeat;
}

/* =========================
   ВЕРХНЕЕ МЕНЮ
========================= */

.topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;

    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;

    padding: 12px 18px;

    background: rgba(12,13,15,.92);
    border-bottom: 1px solid rgba(255,255,255,.15);
    backdrop-filter: blur(8px);
}

.logo {
    font-size: 14px;
    letter-spacing: 2px;
    color: #d7c39a;
    white-space: nowrap;
}

.menu-buttons {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    justify-content: flex-end;
}

.menu-buttons button {
    border: 1px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.06);
    color: #eee;
    padding: 7px 11px;
    border-radius: 5px;
    cursor: pointer;
    font-family: inherit;
    transition: .2s;
}

.menu-buttons button:hover {
    background: rgba(255,255,255,.14);
    transform: translateY(-1px);
}

/* =========================
   ОСНОВНОЙ ЭКРАН
========================= */

.game {
    max-width: 980px;
    margin: 0 auto;
    padding: 105px 20px 60px;
}

.scene {
    background: rgba(14,15,17,.88);
    border: 1px solid rgba(255,255,255,.14);
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
    border-radius: 12px;
    overflow: hidden;
}

.scene-inner {
    padding: 34px;
}

.chapter-label {
    color: #bca778;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 14px;
}

h1 {
    margin: 0 0 18px;
    font-size: clamp(30px, 5vw, 52px);
    line-height: 1.05;
    color: #f0e6d0;
}

h2 {
    margin-top: 0;
    color: #e6d5ad;
    font-size: 30px;
}

h3 {
    color: #d9c494;
}

p {
    font-size: 18px;
    line-height: 1.75;
    color: #ddd;
}

.lead {
    font-size: 21px;
    line-height: 1.65;
    color: #f0eadf;
}

.small {
    font-size: 14px;
    color: #aaa;
}

.quote {
    margin: 25px 0;
    padding: 18px 22px;
    border-left: 3px solid #a89062;
    background: rgba(255,255,255,.045);
    color: #e6dcc9;
    font-style: italic;
    font-size: 18px;
    line-height: 1.6;
}

.info-card {
    margin: 25px 0;
    padding: 20px;
    border: 1px solid rgba(188,167,120,.28);
    background: rgba(188,167,120,.07);
    border-radius: 8px;
}

.info-card strong {
    color: #dec996;
}

/* =========================
   КНОПКИ
========================= */

.buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 30px;
}

.btn {
    display: inline-block;
    padding: 13px 19px;

    border: 1px solid rgba(255,255,255,.22);
    border-radius: 6px;

    background: #292a29;
    color: #f3eee4;

    cursor: pointer;
    font-family: inherit;
    font-size: 16px;

    transition: .2s;
}

.btn:hover {
    background: #3b3c3a;
    transform: translateY(-2px);
}

.btn.primary {
    background: #6e5d3c;
    border-color: #9f895c;
}

.btn.primary:hover {
    background: #81704a;
}

.btn.danger {
    background: #553d39;
}

.btn.choice {
    width: 100%;
    text-align: left;
    padding: 20px;
}

.btn.choice strong {
    display: block;
    color: #ead8ad;
    font-size: 18px;
    margin-bottom: 7px;
}

.btn.choice span {
    color: #c8c5bf;
    line-height: 1.5;
}

/* =========================
   ДОСЬЕ
========================= */

.dossier {
    background: rgba(0,0,0,.22);
    border: 1px solid rgba(255,255,255,.13);
    padding: 24px;
    border-radius: 8px;
    margin-top: 25px;
}

.field {
    margin-bottom: 17px;
}

.field label {
    display: block;
    margin-bottom: 7px;
    color: #d7c49a;
    font-size: 15px;
}

.field input,
.field select {
    width: 100%;
    padding: 12px 13px;

    background: rgba(255,255,255,.07);
    color: #eee;

    border: 1px solid rgba(255,255,255,.18);
    border-radius: 5px;

    font-family: inherit;
    font-size: 16px;
}

.field select option {
    background: #202124;
}

.warning {
    padding: 14px;
    margin: 20px 0;

    background: rgba(180,140,70,.09);
    border: 1px solid rgba(180,140,70,.25);

    color: #d7cdbb;
    line-height: 1.5;
}

/* =========================
   ДНЕВНИК
========================= */

.diary-entry {
    margin: 16px 0;
    padding: 18px;

    background: rgba(255,255,255,.045);
    border-left: 3px solid #85744e;
}

.diary-entry .date {
    color: #aa9974;
    font-size: 13px;
    margin-bottom: 7px;
}

/* =========================
   ИСТОРИЯ
========================= */

.history {
    border-top: 1px solid rgba(255,255,255,.13);
    margin-top: 30px;
    padding-top: 28px;
}

.fact {
    margin: 18px 0;
    padding: 16px 18px;
    background: rgba(255,255,255,.045);
    border-radius: 6px;
}

.fact strong {
    color: #dfcb9c;
}

/* =========================
   ФИНАЛ
========================= */

.final-box {
    text-align: center;
    padding: 25px 0;
}

.final-box h1 {
    color: #e4d0a4;
}

.final-line {
    font-size: 21px;
    line-height: 1.7;
    color: #e2ddd2;
}

/* =========================
   МОБИЛЬНАЯ ВЕРСИЯ
========================= */

@media (max-width: 700px) {

    .topbar {
        align-items: flex-start;
        flex-direction: column;
    }

    .menu-buttons {
        justify-content: flex-start;
    }

    .game {
        padding-top: 145px;
        padding-left: 10px;
        padding-right: 10px;
    }

    .scene-inner {
        padding: 22px;
    }

    p {
        font-size: 17px;
    }

    .lead {
        font-size: 19px;
    }

    .menu-buttons button {
        font-size: 12px;
        padding: 6px 8px;
    }
}

</style>
</head>

<body>

<!-- =========================
     ВЕРХНЕЕ МЕНЮ
========================= -->

<div class="topbar">

    <div class="logo">
        ▲ ТРОПАМИ ПАМЯТИ
    </div>

    <div class="menu-buttons">

        <button onclick="showDossier()">
            📜 ДОСЬЕ
        </button>

        <button onclick="showDiary()">
            📖 ДНЕВНИК
        </button>

        <button onclick="showHistory()">
            📚 ИСТОРИЯ
        </button>

        <button onclick="goHome()">
            🏠 ГЛАВНАЯ
        </button>

    </div>

</div>


<!-- =========================
     ИГРА
========================= -->

<main class="game">

    <div class="scene">

        <div class="scene-inner" id="game">

            <!-- сюда JavaScript вставляет сцены -->

        </div>

    </div>

</main>


<script>

/* =====================================================
   СОСТОЯНИЕ ИГРЫ
===================================================== */

let game = {

    chapter: 0,

    dossier: null,

    mentor: null,

    diary: [],

    choices: [],

    historicalInfo: [],

    finished: false

};


/* =====================================================
   СОХРАНЕНИЕ
===================================================== */

const STORAGE_KEY = "tropamiUndergroundGame";


function saveGame() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(game)
    );

}


function loadGame() {

    const saved =
        localStorage.getItem(STORAGE_KEY);

    if (!saved) return;

    try {

        game = JSON.parse(saved);

    } catch (error) {

        console.log("Не удалось загрузить досье.");

    }

}


/* =====================================================
   РЕНДЕР
===================================================== */

function render(html) {

    document.getElementById("game").innerHTML = html;

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =====================================================
   ГЛАВНАЯ
===================================================== */

function goHome() {

    window.location.href = "index.html";

}


/* =====================================================
   НАЧАЛО
===================================================== */

function startGame() {

    if (game.dossier) {

        renderExistingDossier();

    } else {

        renderPrologue();

    }

}


/* =====================================================
   ПРОЛОГ
===================================================== */

function renderPrologue() {

    render(`

        <div class="chapter-label">
            ТРОПА ПОДПОЛЬЩИКОВ
        </div>

        <h1>
            Там, где нельзя ошибаться
        </h1>

        <p class="lead">
            Представь город, в котором привычная жизнь
            закончилась почти мгновенно.
        </p>

        <p>
            На улицах появились чужие солдаты.
            Изменились правила.
            Исчезло чувство безопасности.
        </p>

        <p>
            Но даже в оккупированном городе
            оставались люди, которые продолжали
            сопротивляться.
        </p>

        <p>
            Их оружием могли стать не только
            смелость и решительность.
            Иногда важнее были память,
            осторожность, наблюдательность
            и доверие.
        </p>

        <div class="quote">
            Подполье существовало там,
            где открытая борьба была слишком опасной.
        </div>

        <div class="info-card">

            <strong>
                В этой истории твой герой — вымышленный.
            </strong>

            <p>
                Исторические события и реальные люди,
                которых ты встретишь, основаны
                на материалах по истории Беларуси
                периода Великой Отечественной войны.
            </p>

        </div>

        <div class="buttons">

            <button
                class="btn primary"
                onclick="showDossierForm()"
            >
                НАЧАТЬ ИСТОРИЮ
            </button>

        </div>

    `);

}


/* =====================================================
   ДОСЬЕ
===================================================== */

function showDossier() {

    if (!game.dossier) {

        showDossierForm();

    } else {

        renderDossier();

    }

}


/* =====================================================
   ФОРМА ДОСЬЕ
===================================================== */

function showDossierForm() {

    render(`

        <div class="chapter-label">
            ЛИЧНОЕ ДОСЬЕ
        </div>

        <h2>
            Создай своего героя
        </h2>

        <p>
            Заполни досье своего героя.
        </p>

        <div class="warning">
            ⚠️ Используй только вымышленные данные —
            это часть игры. Не указывай настоящие
            адреса, телефоны и другие личные сведения.
        </div>

        <div class="dossier">

            <div class="field">

                <label>Имя</label>

                <input
                    id="firstName"
                    placeholder="Например: Алексей"
                >

            </div>


            <div class="field">

                <label>Фамилия</label>

                <input
                    id="lastName"
                    placeholder="Например: Орлов"
                >

            </div>


            <div class="field">

                <label>Возраст</label>

                <input
                    id="age"
                    type="number"
                    min="12"
                    max="80"
                    placeholder="Например: 18"
                >

            </div>


            <div class="field">

                <label>Пол</label>

                <select id="gender">

                    <option value="">
                        Выбери
                    </option>

                    <option value="girl">
                        Девушка
                    </option>

                    <option value="boy">
                        Юноша
                    </option>

                </select>

            </div>


            <div class="field">

                <label>Родной город / деревня</label>

                <input
                    id="place"
                    placeholder="Вымышленное название"
                >

            </div>


            <div class="field">

                <label>Район / область</label>

                <input
                    id="region"
                    placeholder="Например: Минская область"
                >

            </div>


            <div class="field">

                <label>
                    Имя близкого человека
                </label>

                <input
                    id="relative"
                    placeholder="Вымышленное имя"
                >

            </div>


            <div class="field">

                <label>
                    Кем он тебе приходится?
                </label>

                <input
                    id="relativeRole"
                    placeholder="Например: мама, брат, друг"
                >

            </div>


            <div class="field">

                <label>
                    Как тебя узнать?
                </label>

                <input
                    id="mark"
                    placeholder="Особая примета героя"
                >

            </div>


            <div class="field">

                <label>
                    Под каким именем тебя будут знать товарищи?
                </label>

                <input
                    id="codeName"
                    placeholder="Кодовое имя"
                >

            </div>


            <div class="buttons">

                <button
                    class="btn primary"
                    onclick="saveDossier()"
                >
                    💾 СОХРАНИТЬ ДОСЬЕ
                </button>

            </div>

        </div>

    `);

}


/* =====================================================
   СОХРАНЕНИЕ ДОСЬЕ
===================================================== */

function saveDossier() {

    const firstName =
        document.getElementById("firstName").value.trim();

    const lastName =
        document.getElementById("lastName").value.trim();

    const age =
        document.getElementById("age").value.trim();

    const gender =
        document.getElementById("gender").value;

    const place =
        document.getElementById("place").value.trim();

    const region =
        document.getElementById("region").value.trim();

    const relative =
        document.getElementById("relative").value.trim();

    const relativeRole =
        document.getElementById("relativeRole").value.trim();

    const mark =
        document.getElementById("mark").value.trim();

    const codeName =
        document.getElementById("codeName").value.trim();


    if (
        !firstName ||
        !lastName ||
        !age ||
        !gender ||
        !place ||
        !region ||
        !relative ||
        !relativeRole ||
        !mark ||
        !codeName
    ) {

        alert("Заполни все поля досье.");

        return;

    }


    game.dossier = {

        firstName,
        lastName,
        age,
        gender,
        place,
        region,
        relative,
        relativeRole,
        mark,
        codeName

    };


    game.chapter = 1;

    saveGame();

    showDossierAccepted();

}


/* =====================================================
   ДОСЬЕ СОЗДАНО
===================================================== */

function showDossierAccepted() {

    const d = game.dossier;

    render(`

        <div class="chapter-label">
            ДОСЬЕ ПРИНЯТО
        </div>

        <h2>
            ${escapeHTML(d.codeName)}
        </h2>

        <p class="lead">
            Теперь у тебя есть имя,
            под которым тебя будут знать товарищи.
        </p>

        <div class="info-card">

            <strong>
                ${escapeHTML(d.firstName)}
                ${escapeHTML(d.lastName)}
            </strong>

            <p>
                Возраст: ${escapeHTML(d.age)}<br>
                Родом: ${escapeHTML(d.place)}<br>
                ${escapeHTML(d.region)}
            </p>

        </div>

        <p>
            Но настоящее испытание только начинается.
        </p>

        <div class="buttons">

            <button
                class="btn primary"
                onclick="chapter1()"
            >
                ПРОДОЛЖИТЬ
            </button>

        </div>

    `);

}


/* =====================================================
   ПРОДОЛЖЕНИЕ
===================================================== */

function renderExistingDossier() {

    const d = game.dossier;

    render(`

        <div class="chapter-label">
            ТВОЁ ДОСЬЕ
        </div>

        <h2>
            📜 ${escapeHTML(d.codeName)}
        </h2>

        <p>
            ${escapeHTML(d.firstName)}
            ${escapeHTML(d.lastName)},
            ${escapeHTML(d.age)} лет
        </p>

        <p class="small">
            Прогресс истории сохранён.
        </p>

        <div class="buttons">

            <button
                class="btn primary"
                onclick="continueGame()"
            >
                ПРОДОЛЖИТЬ
            </button>

            <button
                class="btn"
                onclick="renderDossier()"
            >
                ПОСМОТРЕТЬ ДОСЬЕ
            </button>

        </div>

    `);

}


function continueGame() {

    switch(game.chapter) {

        case 1:
            chapter1();
            break;

        case 2:
            chapter2();
            break;

        case 3:
            chapter3();
            break;

        case 4:
            chapter4();
            break;

        case 5:
            chapter5();
            break;

        case 6:
            chapter6();
            break;

        default:
            chapter1();

    }

}


/* =====================================================
   ПРОСМОТР ДОСЬЕ
===================================================== */

function renderDossier() {

    const d = game.dossier;

    if (!d) {

        showDossierForm();

        return;

    }

    render(`

        <div class="chapter-label">
            ЛИЧНОЕ ДОСЬЕ
        </div>

        <h2>
            📜 ${escapeHTML(d.codeName)}
        </h2>

        <div class="dossier">

            <p>
                <strong>Имя:</strong>
                ${escapeHTML(d.firstName)}
            </p>

            <p>
                <strong>Фамилия:</strong>
                ${escapeHTML(d.lastName)}
            </p>

            <p>
                <strong>Возраст:</strong>
                ${escapeHTML(d.age)}
            </p>

            <p>
                <strong>Родной город / деревня:</strong>
                ${escapeHTML(d.place)}
            </p>

            <p>
                <strong>Район / область:</strong>
                ${escapeHTML(d.region)}
            </p>

            <p>
                <strong>Близкий человек:</strong>
                ${escapeHTML(d.relative)}
            </p>

            <p>
                <strong>Кем приходится:</strong>
                ${escapeHTML(d.relativeRole)}
            </p>

            <p>
                <strong>Особая примета:</strong>
                ${escapeHTML(d.mark)}
            </p>

            <p>
                <strong>Кодовое имя:</strong>
                ${escapeHTML(d.codeName)}
            </p>

        </div>

        <div class="buttons">

            <button
                class="btn primary"
                onclick="continueGame()"
            >
                ПРОДОЛЖИТЬ ИСТОРИЮ
            </button>

        </div>

    `);

}


/* =====================================================
   ГЛАВА 1
===================================================== */

function chapter1() {

    game.chapter = 1;

    saveGame();

    render(`

        <div class="chapter-label">
            ГЛАВА I · ГОРОД
        </div>

        <h2>
            Жизнь продолжается
        </h2>

        <p>
            Оккупация изменила город.
        </p>

        <p>
            Люди стараются не смотреть друг другу
            в глаза слишком долго.
            Одни боятся.
            Другие молчат.
            Третьи уже ищут способы сопротивляться.
        </p>

        <p>
            Ты ещё не знаешь, кому можно доверять.
        </p>

        <div class="quote">
            Иногда первое правило подпольщика —
            научиться замечать то,
            что другие предпочитают не замечать.
        </div>

        <p>
            Сегодня ты случайно становишься свидетелем
            разговора двух знакомых.
        </p>

        <p>
            Они говорят тихо.
            Слишком тихо.
        </p>

        <div class="info-card">

            <strong>
                Что ты делаешь?
            </strong>

        </div>

        <div class="buttons">

            <button
                class="btn choice"
                onclick="chapter1Choice('listen')"
            >
                <strong>Остаться рядом и послушать</strong>
                <span>
                    Возможно, ты узнаешь что-то важное.
                </span>
            </button>

            <button
                class="btn choice"
                onclick="chapter1Choice('leave')"
            >
                <strong>Уйти и не привлекать внимания</strong>
                <span>
                    Иногда осторожность важнее любопытства.
                </span>
            </button>

        </div>

    `);

}


function chapter1Choice(choice) {

    game.choices.push({
        chapter: 1,
        choice: choice
    });

    game.diary.push({
        date: "Глава I",
        text:
            choice === "listen"
            ? "Я впервые понял(а), что в оккупированном городе даже обычный разговор может иметь значение."
            : "Я решил(а), что не каждую тайну нужно узнавать сразу."
    });

    saveGame();

    chapter2();

}


/* =====================================================
   ГЛАВА 2
===================================================== */

function chapter2() {

    game.chapter = 2;

    saveGame();

    render(`

        <div class="chapter-label">
            ГЛАВА II · ДОВЕРИЕ
        </div>

        <h2>
            Слово, которое нельзя вернуть
        </h2>

        <p>
            Через несколько дней тебе предлагают
            передать сообщение.
        </p>

        <p>
            Ты не знаешь всего содержания.
            И не должен знать.
        </p>

        <p>
            Тебе называют только человека,
            которому нужно передать весточку.
        </p>

/* =====================================================
   ЗАЩИТА ТЕКСТА
===================================================== */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}
