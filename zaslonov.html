<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Тропа Заслонова · Тропами памяти</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#111;
    color:#f2eee6;
}

body{
    min-height:100vh;
    background:
        linear-gradient(rgba(10,10,10,.68),rgba(10,10,10,.88)),
        url("main-background.png") center/cover fixed no-repeat;
}

.topbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
    background:rgba(8,8,8,.9);
    border-bottom:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(8px);
    z-index:50;
}

.logo{
    font-size:14px;
    font-weight:bold;
    letter-spacing:3px;
}

.top-actions{
    display:flex;
    gap:8px;
}

.top-btn{
    padding:9px 13px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.05);
    color:#eee;
    cursor:pointer;
    transition:.2s;
}

.top-btn:hover{
    background:rgba(255,255,255,.12);
}

.screen{
    min-height:100vh;
    padding:96px 20px 60px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.panel{
    width:min(920px,100%);
    padding:42px;
    background:rgba(14,14,14,.88);
    border:1px solid rgba(255,255,255,.13);
    border-radius:18px;
    box-shadow:0 25px 80px rgba(0,0,0,.5);
}

.kicker{
    color:#bca36e;
    letter-spacing:4px;
    font-size:13px;
    margin-bottom:12px;
    text-transform:uppercase;
}

h1,h2,h3{
    font-family:Georgia,serif;
}

h1{
    font-size:clamp(38px,6vw,66px);
    line-height:1;
    margin:0 0 15px;
}

h2{
    font-size:35px;
    margin:0 0 18px;
}

.subtitle{
    color:#bdb8ae;
    font-size:18px;
    line-height:1.6;
}

.story-text{
    color:#e8e2d8;
    font-size:18px;
    line-height:1.82;
    white-space:pre-line;
}

.quote{
    margin:25px 0;
    padding:18px 22px;
    border-left:3px solid #bca36e;
    background:rgba(255,255,255,.045);
    color:#eee3d0;
    font-family:Georgia,serif;
    font-size:20px;
    line-height:1.6;
}

.choice-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:14px;
    margin-top:28px;
}

.choice{
    text-align:left;
    padding:19px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.05);
    color:#f1ede6;
    cursor:pointer;
    transition:.25s;
}

.choice:hover{
    transform:translateY(-2px);
    background:rgba(255,255,255,.095);
    border-color:rgba(188,163,110,.55);
}

.choice-title{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

.choice-note{
    display:block;
    color:#a9a49c;
    font-size:14px;
    line-height:1.45;
}

.primary{
    margin-top:26px;
    padding:14px 21px;
    border:0;
    border-radius:9px;
    background:#bca36e;
    color:#17130d;
    font-weight:bold;
    cursor:pointer;
}

.primary:hover{
    filter:brightness(1.08);
}

.secondary{
    margin-top:14px;
    padding:11px 17px;
    border-radius:9px;
    border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.05);
    color:#eee;
    cursor:pointer;
}

.dossier{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-top:25px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.field.full{
    grid-column:1/-1;
}

.field label{
    color:#bdb6aa;
    font-size:13px;
}

.field input,
.field select{
    padding:13px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,.14);
    background:#1a1a1a;
    color:#f4efe7;
    outline:none;
}

.field input:focus,
.field select:focus{
    border-color:#bca36e;
}

.small-note{
    margin-top:16px;
    color:#969189;
    font-size:13px;
    line-height:1.5;
}

.profile-list{
    display:grid;
    gap:12px;
    margin-top:25px;
}

.profile{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    padding:17px;
    border:1px solid rgba(255,255,255,.13);
    border-radius:10px;
    background:rgba(255,255,255,.045);
}

.profile-code{
    color:#bca36e;
    font-weight:bold;
}

.profile-meta{
    color:#99948c;
    font-size:13px;
    margin-top:3px;
}

.overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.8);
    z-index:100;
}

.overlay.active{
    display:flex;
}

.modal{
    width:min(850px,100%);
    max-height:88vh;
    overflow:auto;
    background:#151515;
    border:1px solid rgba(255,255,255,.15);
    border-radius:16px;
    padding:30px;
}

.diary-entry{
    padding:15px 0;
    border-bottom:1px solid rgba(255,255,255,.09);
}

.diary-entry strong{
    color:#bca36e;
}

.stat-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:24px;
}

.stat{
    background:rgba(255,255,255,.05);
    padding:15px;
    border-radius:9px;
    text-align:center;
}

.stat b{
    display:block;
    font-size:24px;
    color:#bca36e;
}

.fade{
    animation:fade .45s ease;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(8px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media(max-width:700px){

    .panel{
        padding:26px 20px;
    }

    .choice-grid,
    .dossier,
    .stat-grid{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }

    .topbar{
        padding:0 12px;
    }

    .logo{
        font-size:10px;
        letter-spacing:2px;
    }

    .top-btn{
        padding:8px 9px;
        font-size:12px;
    }
}
</style>
</head>

<body>

<div class="topbar">

    <div class="logo">
        ▲ ТРОПАМИ ПАМЯТИ · ОРША
    </div>

    <div class="top-actions">
        <button class="top-btn" onclick="openDossier()">📜 ДОСЬЕ</button>
        <button class="top-btn" onclick="openDiary()">📖 ДНЕВНИК</button>
        <button class="top-btn" onclick="goHome()">🏠 ГЛАВНАЯ</button>
    </div>

</div>

<div id="app"></div>

<div id="dossierOverlay" class="overlay">
    <div class="modal">
        <div id="dossierContent"></div>
    </div>
</div>

<div id="diaryOverlay" class="overlay">
    <div class="modal">

        <h2>📖 Дневник</h2>

        <div id="diaryContent"></div>

        <button class="secondary" onclick="closeOverlays()">
            Закрыть
        </button>

    </div>
</div>

<script>

/* =========================================================
   СОСТОЯНИЕ
========================================================= */

let hero = null;

let game = {
    scene:0,
    trust:0,
    caution:0,
    courage:0,
    information:0,
    diary:[],
    discoveries:[],
    finished:false
};

const STORAGE_KEY = "tropami_zaslonov_profiles";


/* =========================================================
   СОХРАНЕНИЕ
========================================================= */

function getProfiles(){

    try{
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    }catch(e){
        return [];
    }
}

function saveProfiles(profiles){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(profiles)
    );
}

function saveCurrent(){

    if(!hero) return;

    hero.game = game;

    const profiles = getProfiles();

    const index = profiles.findIndex(
        p => p.id === hero.id
    );

    if(index >= 0){
        profiles[index] = hero;
    }else{
        profiles.push(hero);
    }

    saveProfiles(profiles);
}


/* =========================================================
   РЕНДЕР
========================================================= */

function render(html){

    document.getElementById("app").innerHTML =
        `<div class="screen fade">${html}</div>`;
}

function goHome(){

    window.location.href = "index.html";
}


/* =========================================================
   СТАРТ
========================================================= */

function start(){

    const profiles = getProfiles();

    if(profiles.length){

        showProfileChoice();

    }else{

        showIntro();
    }
}


/* =========================================================
   ВСТУПЛЕНИЕ
========================================================= */

function showIntro(){

    render(`

        <div class="panel">

            <div class="kicker">
                ВТОРАЯ ТРОПА · ОРША
            </div>

            <h1>Шум колёс</h1>

            <div class="subtitle">
                Орша. Осень 1941 года.
            </div>

            <div class="quote">
                «На железной дороге всё имеет значение:
                звук, время, человек, который задержался
                у окна слишком долго».
            </div>

            <div class="story-text">

Ты слышишь поезд раньше, чем видишь его.

Гул приближается.

Стекло дрожит.

Где-то далеко закрывается дверь депо.

Орша живёт по новому расписанию.

Но железная дорога всё ещё остаётся
сердцем города.

И именно поэтому здесь нельзя ошибаться.

Ты пока не знаешь,
что совсем скоро окажешься внутри
подпольной сети.

И что одним из её руководителей станет
человек, которого железнодорожники
будут называть просто:

«Дядя Костя».

            </div>

            <button class="primary"
                    onclick="showDossierIntro()">

                НАЧАТЬ ИСТОРИЮ

            </button>

        </div>

    `);
}


/* =========================================================
   ДОСЬЕ
========================================================= */

function showDossierIntro(){

    render(`

        <div class="panel">

            <div class="kicker">
                ЛИЧНОЕ ДОСЬЕ
            </div>

            <h2>
                Создай своего героя
            </h2>

            <div class="story-text">

Твой герой вымышленный.

Ты можешь представить себя
работником железной дороги,
связным, жителем Орши
или человеком, который случайно
оказался рядом с подпольем.

Используй только придуманные данные.

            </div>

            <button class="primary"
                    onclick="showDossierForm()">

                ЗАПОЛНИТЬ ДОСЬЕ

            </button>

        </div>

    `);
}


function showDossierForm(existing=null){

    render(`

        <div class="panel">

            <div class="kicker">
                ЛИЧНОЕ ДОСЬЕ
            </div>

            <h2>
                Заполни досье своего героя
            </h2>

            <div class="dossier">

                <div class="field">

                    <label>Имя</label>

                    <input
                        id="firstName"
                        value="${existing?.firstName || ""}"
                    >

                </div>


                <div class="field">

                    <label>Фамилия</label>

                    <input
                        id="lastName"
                        value="${existing?.lastName || ""}"
                    >

                </div>


                <div class="field">

                    <label>Возраст</label>

                    <input
                        id="age"
                        type="number"
                        min="12"
                        max="80"
                        value="${existing?.age || ""}"
                    >

                </div>


                <div class="field">

                    <label>Пол</label>

                    <select id="gender">

                        <option value="">
                            Выбери
                        </option>

                        <option
                            ${existing?.gender==="Женский"?"selected":""}>
                            Женский
                        </option>

                        <option
                            ${existing?.gender==="Мужской"?"selected":""}>
                            Мужской
                        </option>

                    </select>

                </div>


                <div class="field">

                    <label>
                        Родной город / деревня
                    </label>

                    <input
                        id="homePlace"
                        value="${existing?.homePlace || ""}"
                    >

                </div>


                <div class="field">

                    <label>
                        Район / область
                    </label>

                    <input
                        id="region"
                        value="${existing?.region || ""}"
                    >

                </div>


                <div class="field">

                    <label>
                        Имя близкого человека
                    </label>

                    <input
                        id="relativeName"
                        value="${existing?.relativeName || ""}"
                    >

                </div>


                <div class="field">

                    <label>
                        Кем он тебе приходится?
                    </label>

                    <input
                        id="relativeRole"
                        value="${existing?.relativeRole || ""}"
                    >

                </div>


                <div class="field full">

                    <label>
                        Как тебя узнать? Особая примета
                    </label>

                    <input
                        id="specialMark"
                        value="${existing?.specialMark || ""}"
                    >

                </div>


                <div class="field full">

                    <label>
                        Под каким именем тебя будут знать товарищи?
                    </label>

                    <input
                        id="codeName"
                        value="${existing?.codeName || ""}"
                    >

                </div>

            </div>


            <div class="small-note">

                Все данные являются частью игры.
                Не вводи реальные персональные сведения.

            </div>


            <button class="primary"
                    onclick="createHero()">

                💾 СОХРАНИТЬ ДОСЬЕ

            </button>

        </div>

    `);
}


function createHero(){

    const firstName =
        document.getElementById("firstName").value.trim();

    const lastName =
        document.getElementById("lastName").value.trim();

    const age =
        document.getElementById("age").value.trim();

    const gender =
        document.getElementById("gender").value;

    const homePlace =
        document.getElementById("homePlace").value.trim();

    const region =
        document.getElementById("region").value.trim();

    const relativeName =
        document.getElementById("relativeName").value.trim();

    const relativeRole =
        document.getElementById("relativeRole").value.trim();

    const specialMark =
        document.getElementById("specialMark").value.trim();

    const codeName =
        document.getElementById("codeName").value.trim();


    if(
        !firstName ||
        !lastName ||
        !age ||
        !gender ||
        !homePlace ||
        !region ||
        !relativeName ||
        !relativeRole ||
        !specialMark ||
        !codeName
    ){

        alert("Заполни все поля досье.");

        return;
    }


    hero = {

        id:"hero_" + Date.now(),

        firstName,
        lastName,
        age,
        gender,
        homePlace,
        region,
        relativeName,
        relativeRole,
        specialMark,
        codeName,

        path:"Подпольщики",

        mentor:"Константин Сергеевич Заслонов",

        game:{
            scene:0,
            trust:0,
            caution:0,
            courage:0,
            information:0,
            diary:[],
            discoveries:[],
            finished:false
        }

    };


    game = hero.game;

    saveCurrent();

    scene0();
}


/* =========================================================
   ПРОФИЛИ
========================================================= */

function showProfileChoice(){

    const profiles = getProfiles();

    let html = `

        <div class="panel">

            <div class="kicker">
                АРХИВ
            </div>

            <h2>
                Выбери своё досье
            </h2>

            <div class="story-text">

Ты уже создавал героя.

Продолжи его историю
или создай нового.

            </div>

            <div class="profile-list">
    `;


    profiles.forEach(p=>{

        const progress =
            p.game?.finished
            ? "История завершена"
            : "История продолжается";


        html += `

            <div class="profile">

                <div>

                    <div class="profile-code">
                        📜 ${escapeHtml(p.codeName)}
                    </div>

                    <div>
                        ${escapeHtml(p.firstName)}
                        ${escapeHtml(p.lastName)},
                        ${escapeHtml(String(p.age))}
                    </div>

                    <div class="profile-meta">
                        Заслонов · ${progress}
                    </div>

                </div>


                <button
                    class="primary"
                    style="margin:0"
                    onclick="loadProfile('${p.id}')">

                    ПРОДОЛЖИТЬ

                </button>

            </div>

        `;
    });


    html += `

            </div>

            <button
                class="secondary"
                onclick="showDossierIntro()">

                Создать новое досье

            </button>

        </div>
    `;


    render(html);
}


function loadProfile(id){

    const profiles = getProfiles();

    const found =
        profiles.find(p=>p.id===id);

    if(!found) return;

    hero = found;

    game = found.game;


    if(game.finished){

        showEnding();

    }else{

        continueStory();
    }
}


/* =========================================================
   ПЕРЕХОД МЕЖДУ СЦЕНАМИ
========================================================= */

function nextScene(){

    game.scene++;

    saveCurrent();

    continueStory();
}


function continueStory(){

    switch(game.scene){

        case 0: scene0(); break;
        case 1: scene1(); break;
        case 2: scene2(); break;
        case 3: scene3(); break;
        case 4: scene4(); break;
        case 5: scene5(); break;
        case 6: scene6(); break;
        case 7: scene7(); break;
        case 8: scene8(); break;
        case 9: scene9(); break;
        case 10: scene10(); break;

        default:
            showEnding();
    }
}


function addDiary(text){

    game.diary.push({

        date:new Date()
            .toLocaleDateString("ru-RU"),

        text

    });
}


function addDiscovery(text){

    if(!game.discoveries.includes(text)){

        game.discoveries.push(text);
    }
}


/* =========================================================
   СЦЕНА 0
========================================================= */

function scene0(){

    render(`

        <div class="panel">

            <div class="kicker">
                ОРША · ОСЕНЬ 1941
            </div>

            <h2>
                Город железной дороги
            </h2>

            <div class="story-text">

Осень пришла рано.

Утром над Оршей стоит холодный туман.

Железнодорожные пути исчезают в серой дымке.

Ты смотришь на депо.

Люди приходят на работу.

Паровозы уходят.

Составы проходят один за другим.

С виду всё продолжается как прежде.

Но ты знаешь:
город уже не тот.

            </div>

            <div class="quote">

                Иногда самое заметное место
                становится лучшим местом для тайны.

            </div>

            <div class="story-text">

Сегодня тебе впервые предлагают
сделать нечто большее,
чем просто свою работу.

Но человек, который предлагает,
не называет себя.

Он только говорит:

«Если хочешь помочь,
научись сначала замечать».

            </div>


            <div class="choice-grid">

                <button class="choice"
                    onclick="
                        game.caution++;
                        addDiary('Я решил сначала наблюдать за происходящим в депо.');
                        addDiscovery('Оршанское депо');
                        nextScene();
                    ">

                    <span class="choice-title">
                        Наблюдать
                    </span>

                    <span class="choice-note">
                        Сначала понять, кому можно доверять.
                    </span>

                </button>


                <button class="choice"
                    onclick="
                        game.courage++;
                        addDiary('Я решил показать, что готов помогать.');
                        addDiscovery('Оршанское депо');
                        nextScene();
                    ">

                    <span class="choice-title">
                        Сразу предложить помощь
                    </span>

                    <span class="choice-note">
                        Иногда ждать слишком долго тоже опасно.
                    </span>

                </button>

            </div>

        </div>

    `);
}


/* =========================================================
   СЦЕНА 1
========================================================= */

function scene1(){

    render(`

        <div class="panel">

            <div class="kicker">
                ГЛАВА I
            </div>

            <h2>
                Дядя Костя
            </h2>

            <div class="story-text">

Ты впервые слышишь это имя
неофициально.

«Дядя Костя».

Никто не объясняет,
кто это.

Через несколько минут
ты видишь человека,
который спокойно проходит
по территории депо.

Он разговаривает с рабочими.

Задаёт вопросы.

Запоминает ответы.

Смотрит на часы.

Ничего необычного.

И всё же остальные
относятся к нему иначе.

            </div>

            <div class="quote">

                — Заслонов.

                Так его называют,
                когда уверены,
                что рядом нет чужих ушей.

            </div>

            <div class="story-text">

Константин Сергеевич Заслонов.

До войны он работал на железной дороге
и руководил депо.

Теперь он вернулся в Оршу
в совершенно другой реальности.

Ты пока не знаешь,
что именно он задумал.

            </div>


            <button class="primary"
                onclick="

            border-color:rgba(255,255,255,.1);
            margin:25px 0;
        ">


        <div class="story-text">

            <b>Историческая линия:</b>

            Константин Сергеевич Заслонов

        </div>

    `;

/* =========================================================
   ДНЕВНИК
========================================================= */

function openDiary(){

    if(!hero){

        alert("Сначала создай героя.");

        return;
    }


    let html = "";


    if(!game.diary.length){

        html = `

            <div class="story-text">

                Пока здесь пусто.

                Дневник начнётся вместе
                с твоей историей.

            </div>

        `;

    }else{

        game.diary.forEach((entry,index)=>{

            html += `

                <div class="diary-entry">

                    <strong>
                        Запись ${index+1}
                        ·
                        ${escapeHtml(entry.date)}
                    </strong>

                    <div class="story-text">

                        ${escapeHtml(entry.text)}

                    </div>

                </div>

            `;

        });
    }


    document.getElementById("diaryContent")
        .innerHTML = html;


    document.getElementById("diaryOverlay")
        .classList.add("active");
}


function closeOverlays(){

    document
        .querySelectorAll(".overlay")
        .forEach(x =>
            x.classList.remove("active")
        );
}


/* =========================================================
   ЗАЩИТА ТЕКСТА
========================================================= */

function escapeHtml(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}
