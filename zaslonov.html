<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Тропа Заслонова · Тропами памяти</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#111;
    color:#f2eee6;
}

body{
    min-height:100vh;
    background:
        linear-gradient(rgba(10,10,10,.68),rgba(10,10,10,.88)),
        url("main-background.png") center/cover fixed no-repeat;
}

.topbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
    background:rgba(8,8,8,.92);
    border-bottom:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(8px);
    z-index:50;
}

.logo{
    font-size:14px;
    font-weight:bold;
    letter-spacing:3px;
}

.top-actions{
    display:flex;
    gap:8px;
}

.top-btn{
    padding:9px 13px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.05);
    color:#eee;
    cursor:pointer;
    transition:.2s;
}

.top-btn:hover{
    background:rgba(255,255,255,.12);
}

.screen{
    min-height:100vh;
    padding:96px 20px 60px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.panel{
    width:min(920px,100%);
    padding:42px;
    background:rgba(14,14,14,.9);
    border:1px solid rgba(255,255,255,.13);
    border-radius:18px;
    box-shadow:0 25px 80px rgba(0,0,0,.5);
}

.kicker{
    color:#bca36e;
    letter-spacing:4px;
    font-size:13px;
    margin-bottom:12px;
    text-transform:uppercase;
}

h1,h2,h3{
    font-family:Georgia,serif;
}

h1{
    font-size:clamp(38px,6vw,66px);
    line-height:1;
    margin:0 0 15px;
}

h2{
    font-size:35px;
    margin:0 0 18px;
}

.subtitle{
    color:#bdb8ae;
    font-size:18px;
    line-height:1.6;
}

.story-text{
    color:#e8e2d8;
    font-size:18px;
    line-height:1.82;
    white-space:pre-line;
}

.quote{
    margin:25px 0;
    padding:18px 22px;
    border-left:3px solid #bca36e;
    background:rgba(255,255,255,.045);
    color:#eee3d0;
    font-family:Georgia,serif;
    font-size:20px;
    line-height:1.6;
}

.choice-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:14px;
    margin-top:28px;
}

.choice{
    text-align:left;
    padding:19px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.05);
    color:#f1ede6;
    cursor:pointer;
    transition:.25s;
}

.choice:hover{
    transform:translateY(-2px);
    background:rgba(255,255,255,.095);
    border-color:rgba(188,163,110,.55);
}

.choice-title{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

.choice-note{
    display:block;
    color:#a9a49c;
    font-size:14px;
    line-height:1.45;
}

.primary{
    margin-top:26px;
    padding:14px 21px;
    border:0;
    border-radius:9px;
    background:#bca36e;
    color:#17130d;
    font-weight:bold;
    cursor:pointer;
}

.primary:hover{
    filter:brightness(1.08);
}

.secondary{
    margin-top:14px;
    padding:11px 17px;
    border-radius:9px;
    border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.05);
    color:#eee;
    cursor:pointer;
}

.dossier{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-top:25px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.field.full{
    grid-column:1/-1;
}

.field label{
    color:#bdb6aa;
    font-size:13px;
}

.field input,
.field select{
    padding:13px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,.14);
    background:#1a1a1a;
    color:#f4efe7;
    outline:none;
}

.field input:focus,
.field select:focus{
    border-color:#bca36e;
}

.small-note{
    margin-top:16px;
    color:#969189;
    font-size:13px;
    line-height:1.5;
}

.profile-list{
    display:grid;
    gap:12px;
    margin-top:25px;
}

.profile{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    padding:17px;
    border:1px solid rgba(255,255,255,.13);
    border-radius:10px;
    background:rgba(255,255,255,.045);
}

.profile-code{
    color:#bca36e;
    font-weight:bold;
}

.profile-meta{
    color:#99948c;
    font-size:13px;
    margin-top:3px;
}

.overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.8);
    z-index:100;
}

.overlay.active{
    display:flex;
}

.modal{
    width:min(850px,100%);
    max-height:88vh;
    overflow:auto;
    background:#151515;
    border:1px solid rgba(255,255,255,.15);
    border-radius:16px;
    padding:30px;
}

.diary-entry{
    padding:15px 0;
    border-bottom:1px solid rgba(255,255,255,.09);
}

.diary-entry strong{
    color:#bca36e;
}

.stat-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin:30px 0;
}

.stat{
    padding:17px;
    text-align:center;
    border-radius:10px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);
    color:#aaa;
}

.stat b{
    display:block;
    color:#eee;
    font-size:27px;
    margin-bottom:5px;
}

hr{
    border:0;
    border-top:1px solid rgba(255,255,255,.1);
}

@media(max-width:700px){

    .topbar{
        padding:0 12px;
    }

    .logo{
        font-size:11px;
        letter-spacing:2px;
    }

    .top-btn{
        padding:8px 9px;
        font-size:12px;
    }

    .screen{
        padding:88px 12px 35px;
    }

    .panel{
        padding:25px 20px;
    }

    h2{
        font-size:29px;
    }

    .story-text{
        font-size:16px;
    }

    .quote{
        font-size:18px;
    }

    .choice-grid,
    .dossier{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }

    .stat-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="topbar">

    <div class="logo">
        ▲ ТРОПАМИ ПАМЯТИ
    </div>

    <div class="top-actions">

        <button class="top-btn" onclick="openDossier()">
            📜 ДОСЬЕ
        </button>

        <button class="top-btn" onclick="openDiary()">
            📖 ДНЕВНИК
        </button>

        <button class="top-btn" onclick="goHome()">
            🏠 ГЛАВНАЯ
        </button>

    </div>

</div>


<div class="screen">

    <main id="game"></main>

</div>


<!-- =========================
     ДОСЬЕ
========================= -->

<div class="overlay" id="dossierOverlay">

    <div class="modal">

        <div id="dossierContent"></div>

    </div>

</div>


<!-- =========================
     ДНЕВНИК
========================= -->

<div class="overlay" id="diaryOverlay">

    <div class="modal">

        <h2>📖 Дневник</h2>

        <div id="diaryContent"></div>

        <button class="secondary"
                onclick="closeOverlays()">

            Закрыть

        </button>

    </div>

</div>


<script>

/* =========================================================
   СОСТОЯНИЕ ИГРЫ
========================================================= */

let hero = null;

let game = {

    scene:0,

    trust:0,

    caution:0,

    courage:0,

    information:0,

    diary:[],

    discoveries:[],

    finished:false
};


/* =========================================================
   ПРОФИЛИ
========================================================= */

function getProfiles(){

    try{

        return JSON.parse(
            localStorage.getItem("tropamiProfiles") || "[]"
        );

    }catch(e){

        return [];

    }
}


function saveProfiles(profiles){

    localStorage.setItem(
        "tropamiProfiles",
        JSON.stringify(profiles)
    );
}


function saveCurrent(){

    if(!hero) return;

    hero.game = game;

    const profiles = getProfiles();

    const index =
        profiles.findIndex(
            p => p.id === hero.id
        );

    if(index >= 0){

        profiles[index] = hero;

    }else{

        profiles.push(hero);

    }

    saveProfiles(profiles);
}


/* =========================================================
   ДОСЬЕ — СТАРТ
========================================================= */

function start(){

    const profiles = getProfiles();

    if(profiles.length){

        showProfileChoice();

    }else{

        showDossierIntro();

    }
}


/* =========================================================
   ВЫБОР ДОСЬЕ
========================================================= */

function showProfileChoice(){

    let html = `

        <div class="panel">

            <div class="kicker">
                ЛИЧНОЕ ДОСЬЕ
            </div>

            <h2>
                Выбери своё досье
            </h2>

            <div class="story-text">

                Если ты уже начинала эту историю,
                можешь продолжить её.

                Или создать нового героя.

            </div>

            <div class="profile-list">

    `;

    getProfiles().forEach(profile => {

        const progress =
            profile.game
                ? profile.game.scene
                : 0;

        html += `

            <div class="profile">

                <div>

                    <div class="profile-code">
                        📜 ${escapeHtml(profile.codeName)}
                    </div>

                    <div>
                        ${escapeHtml(profile.firstName)}
                        ${escapeHtml(profile.lastName)}
                    </div>

                    <div class="profile-meta">

                        ${escapeHtml(String(profile.age))}
                        лет ·
                        Тропа Заслонова ·
                        глава ${progress}

                    </div>

                </div>

                <button
                    class="primary"
                    onclick="loadProfile('${profile.id}')">

                    ПРОДОЛЖИТЬ

                </button>

            </div>

        `;

    });

    html += `

            </div>

            <button
                class="secondary"
                onclick="showDossierIntro()">

                Создать новое досье

            </button>

        </div>

    `;

    document.getElementById("game").innerHTML = html;
}


/* =========================================================
   СОЗДАНИЕ ДОСЬЕ
========================================================= */

function showDossierIntro(){

    document.getElementById("game").innerHTML = `

        <div class="panel">

            <div class="kicker">
                ЛИЧНОЕ ДОСЬЕ
            </div>

            <h1>
                Тропа Заслонова
            </h1>

            <div class="subtitle">

                Заполни досье своего героя.

                <br><br>

                Используй вымышленные данные —
                это часть игры.

            </div>

            <div class="dossier">

                <div class="field">

                    <label>Имя</label>

                    <input
                        id="firstName"
                        placeholder="Например, Иван">

                </div>

                <div class="field">

                    <label>Фамилия</label>

                    <input
                        id="lastName"
                        placeholder="Например, Орлов">

                </div>

                <div class="field">

                    <label>Возраст</label>

                    <input
                        id="age"
                        type="number"
                        min="12"
                        max="80"
                        placeholder="18">

                </div>

                <div class="field">

                    <label>Пол</label>

                    <select id="gender">

                        <option value="">
                            Выбрать
                        </option>

                        <option>
                            Женский
                        </option>

                        <option>
                            Мужской
                        </option>

                    </select>

                </div>

                <div class="field">

                    <label>
                        Родной город / деревня
                    </label>

                    <input
                        id="homePlace"
                        placeholder="Вымышленное место">

                </div>

                <div class="field">

                    <label>
                        Район / область
                    </label>

                    <input
                        id="region"
                        placeholder="Например, Витебская область">

                </div>

                <div class="field">

                    <label>
                        Имя близкого человека
                    </label>

                    <input
                        id="relativeName"
                        placeholder="Вымышленное имя">

                </div>

                <div class="field">

                    <label>
                        Кем он приходится
                    </label>

                    <input
                        id="relativeRole"
                        placeholder="Например, брат">

                </div>

                <div class="field full">

                    <label>
                        Кому сообщить о твоей судьбе,
                        если ты погибнешь или попадёшь в плен?
                    </label>

                    <input
                        id="relativeMessage"
                        placeholder="Имя близкого человека">

                </div>

                <div class="field full">

                    <label>
                        Как тебя узнать?
                    </label>

                    <input
                        id="specialMark"
                        placeholder="Особая примета">

                </div>

                <div class="field full">

                    <label>
                        Под каким именем тебя будут знать товарищи?
                    </label>

                    <input
                        id="codeName"
                        placeholder="Кодовое имя">

                </div>

            </div>

            <div class="small-note">

                Все данные используются только внутри игры
                и сохраняются в браузере этого устройства.

            </div>

            <button
                class="primary"
                onclick="createHero()">

                💾 СОХРАНИТЬ ДОСЬЕ

            </button>

        </div>

    `;
}


/* =========================================================
   СОЗДАНИЕ ГЕРОЯ
========================================================= */

function value(id){

    return document
        .getElementById(id)
        .value
        .trim();
}


function createHero(){

    const firstName = value("firstName");
    const lastName = value("lastName");
    const age = value("age");
    const gender = value("gender");
    const homePlace = value("homePlace");
    const region = value("region");
    const relativeName = value("relativeName");
    const relativeRole = value("relativeRole");
    const relativeMessage = value("relativeMessage");
    const specialMark = value("specialMark");
    const codeName = value("codeName");

    if(
        !firstName ||
        !lastName ||
        !age ||
        !gender ||
        !homePlace ||
        !region ||
        !relativeName ||
        !relativeRole ||
        !specialMark ||
        !codeName
    ){

        alert("Заполни, пожалуйста, все основные поля досье.");

        return;
    }

    hero = {

        id:
            Date.now().toString() +
            Math.random().toString(16).slice(2),

        firstName,
        lastName,
        age,
        gender,
        homePlace,
        region,
        relativeName,
        relativeRole,
        relativeMessage,
        specialMark,
        codeName,

        game:{

            scene:0,
            trust:0,
            caution:0,
            courage:0,
            information:0,
            diary:[],
            discoveries:[],
            finished:false

        }

    };

    game = hero.game;

    saveCurrent();

    continueStory();
}


/* =========================================================
   ЗАГРУЗКА
========================================================= */

function loadProfile(id){

    const profiles = getProfiles();

    const found =
        profiles.find(
            p => p.id === id
        );

    if(!found) return;

    hero = found;

    game = found.game || {

        scene:0,
        trust:0,
        caution:0,
        courage:0,
        information:0,
        diary:[],
        discoveries:[],
        finished:false

    };

    if(game.finished){

        showEnding();

    }else{

        continueStory();

    }
}


/* =========================================================
   ПЕРЕХОД
========================================================= */

function nextScene(){

    game.scene++;

    saveCurrent();

    continueStory();
}


function continueStory(){

    switch(game.scene){

        case 0:
            scene0();
            break;

        case 1:
            scene1();
            break;

        case 2:
            scene2();
            break;

        case 3:
            scene3();
            break;

        case 4:
            scene4();
            break;

        case 5:
            scene5();
            break;

        case 6:
            scene6();
            break;

        case 7:
            scene7();
            break;

        case 8:
            scene8();
            break;

        case 9:
            scene9();
            break;

        case 10:
            scene10();
            break;

        case 11:
            scene11();
            break;

        case 12:
            scene12();
            break;

        case 13:
            scene13();
            break;

        default:
            showEnding();

    }
}


/* =========================================================
   ДНЕВНИК
========================================================= */

function addDiary(text){

    game.diary.push({

        date:
            new Date()
            .toLocaleDateString("ru-RU"),

        text

    });

}


function addDiscovery(text){

    if(!game.discoveries.includes(text)){

        game.discoveries.push(text);

    }
}


/* =========================================================
   СЦЕНА 0
========================================================= */

function scene0(){

    render(`

        <div class="panel">

            <div class="kicker">
                ОРША · ОСЕНЬ 1941
            </div>

            <h2>
                Город железной дороги
            </h2>

            <div class="story-text">

Осень пришла рано.

Утром над Оршей стоит холодный туман.

Железнодорожные пути исчезают в серой дымке.

Ты смотришь на депо.

Люди приходят на работу.

Паровозы уходят.

Составы проходят один за другим.

С виду всё продолжается как прежде.

Но ты знаешь:

город уже не тот.

            </div>

            <div class="quote">

                Иногда самое заметное место
                становится лучшим местом для тайны.

            </div>

            <div class="story-text">

Сегодня тебе впервые предлагают
сделать нечто большее,
чем просто свою работу.

Но человек, который предлагает,
не называет себя.

Он только говорит:

«Если хочешь помочь,
научись сначала замечать».

            </div>

            <div class="choice-grid">

                <button class="choice"
                    onclick="
                        game.caution++;
                        addDiary('Я решил сначала наблюдать за происходящим в депо.');
                        addDiscovery('Оршанское депо');
                        nextScene();
                    ">

                    <span class="choice-title">
                        Наблюдать
                    </span>

                    <span class="choice-note">
                        Сначала понять, кому можно доверять.
                    </span>

                </button>

                <button class="choice"
                    onclick="
                        game.courage++;
                        addDiary('Я решил показать, что готов помогать.');
                        addDiscovery('Оршанское депо');
                        nextScene();
                    ">

                    <span class="choice-title">
                        Сразу предложить помощь
                    </span>

                    <span class="choice-note">
                        Иногда ждать слишком долго тоже опасно.
                    </span>

                </button>

            </div>

        </div>

    `);
}


/* =========================================================
   СЦЕНА 1
========================================================= */

function scene1(){

    render(`

        <div class="panel">

            <div class="kicker">
                ГЛАВА I
            </div>

            <h2>
                Дядя Костя
            </h2>

            <div class="story-text">

Ты впервые слышишь это имя
неофициально.

«Дядя Костя».

Никто не объясняет,
кто это.

Через несколько минут
ты видишь человека,
который спокойно проходит
по территории депо.

Он разговаривает с рабочими.

Задаёт вопросы.

Запоминает ответы.

Смотрит на часы.

Ничего необычного.

И всё же остальные
относятся к нему иначе.

            </div>

            <div class="quote">

                — Заслонов.

                Так его называют,
                когда уверены,
                что рядом нет чужих ушей.

            </div>

            <div class="story-text">

Константин Сергеевич Заслонов.

До войны он работал на железной дороге
и руководил депо.

Теперь он вернулся в Оршу
в совершенно другой реальности.

Ты пока не знаешь,
что именно он задумал.

            </div>

            <button class="primary"
                onclick="
                    game.trust++;
                    addDiscovery('Константин Заслонов');
                    addDiary('Сегодня я впервые узнал имя Константина Заслонова.');
                    nextScene();
                ">

                ЗАПОМНИТЬ ИМЯ

            </button>

        </div>

    `);
}


/* =========================================================
   СЦЕНА 2
========================================================= */

function scene2(){

    render(`

        <div class="panel">

            <div class="kicker">
                ГЛАВА II
            </div>

            <h2>
                Работа
            </h2>

            <div class="story-text">

Ты продолжаешь работать.

И постепенно понимаешь:
именно обычная работа
становится частью борьбы.

Нужно приходить вовремя.

Не задавать лишних вопросов.

Не привлекать внимания.

Запоминать людей.

Замечать изменения.

Однажды Заслонов останавливается
рядом с тобой.

Он говорит тихо:

            </div>

            <div class="quote">

                — На железной дороге
                случайностей меньше,
                чем кажется.

складывалась борьба,
которую сегодня называют
сопротивлением.

            </div>

            <div class="stat-grid">

                <div class="stat">

                    <b>${game.trust}</b>

                    доверие

                </div>

                <div class="stat">

                    <b>${game.caution}</b>

                    осторожность

                </div>

                <div class="stat">

                    <b>${game.information}</b>

                    сведения

                </div>

            </div>

            <button class="primary"
                onclick="showEnding()">

                ЗАКРЫТЬ ИСТОРИЮ

            </button>

        </div>

    `);
}


/* =========================================================
   ФИНАЛЬНЫЙ ЭКРАН
========================================================= */

function showEnding(){

    render(`

        <div class="panel">

            <div class="kicker">
                ИСТОРИЯ ЗАВЕРШЕНА
            </div>

            <h2>
                Тропа Заслонова
            </h2>

            <div class="story-text">

${escapeHtml(hero.firstName)},
${escapeHtml(hero.codeName)}.

Ты прошёл путь
от городского подполья
до партизанского леса.

Но твой герой был вымышленным.

История Константина Заслонова —
реальна.

            </div>

            <div class="quote">

                Орша.

                Железная дорога.

                Подполье.

                Лес.

                Память.

            </div>

            <button class="primary"
                onclick="goHome()">

                🏠 ВЕРНУТЬСЯ НА ГЛАВНУЮ

            </button>

            <br>

            <button class="secondary"
                onclick="openDiary()">

                📖 ОТКРЫТЬ ДНЕВНИК

            </button>

        </div>

    `);
}


/* =========================================================
   ДОСЬЕ ВО ВРЕМЯ ИГРЫ
========================================================= */

function openDossier(){

    if(!hero){

        showDossierIntro();

        return;

    }

    document.getElementById("dossierContent").innerHTML = `

        <h2>
            📜 Личное досье
        </h2>

        <div class="story-text">

            <b>Имя:</b>
            ${escapeHtml(hero.firstName)}

            <br><br>

            <b>Фамилия:</b>
            ${escapeHtml(hero.lastName)}

            <br><br>

            <b>Возраст:</b>
            ${escapeHtml(String(hero.age))}

            <br><br>

            <b>Пол:</b>
            ${escapeHtml(hero.gender)}

            <br><br>

            <b>Родной город / деревня:</b>
            ${escapeHtml(hero.homePlace)}

            <br><br>

            <b>Район / область:</b>
            ${escapeHtml(hero.region)}

            <br><br>

            <b>Близкий человек:</b>
            ${escapeHtml(hero.relativeName)}

            <br><br>

            <b>Кем приходится:</b>
            ${escapeHtml(hero.relativeRole)}

            <br><br>

            <b>Особая примета:</b>
            ${escapeHtml(hero.specialMark)}

            <br><br>

            <b>Кодовое имя:</b>
            ${escapeHtml(hero.codeName)}

        </div>

        <hr>

        <div class="story-text">

            <b>Историческая линия:</b>

            <br><br>

            Константин Сергеевич Заслонов

        </div>

        <button class="secondary"
            onclick="closeOverlays()">

            Закрыть

        </button>

    `;

    document
        .getElementById("dossierOverlay")
        .classList.add("active");
}


/* =========================================================
   ДНЕВНИК
========================================================= */

function openDiary(){

    if(!hero){

        alert("Сначала создай героя.");

        return;

    }

    let html = "";

    if(!game.diary.length){

        html = `

            <div class="story-text">

                Пока здесь пусто.

                Дневник начнётся вместе
                с твоей историей.

            </div>

        `;

    }else{

        game.diary.forEach((entry,index)=>{

            html += `

                <div class="diary-entry">

                    <strong>

                        Запись ${index + 1}
                        ·
                        ${escapeHtml(entry.date)}

                    </strong>

                    <div class="story-text">

                        ${escapeHtml(entry.text)}

                    </div>

                </div>

            `;

        });

    }

    document.getElementById("diaryContent").innerHTML = html;

    document
        .getElementById("diaryOverlay")
        .classList.add("active");
}


/* =========================================================
   ЗАКРЫТИЕ ОКОН
========================================================= */

function closeOverlays(){

    document
        .querySelectorAll(".overlay")
        .forEach(
            element =>
                element.classList.remove("active")
        );

}


/* =========================================================
   ГЛАВНАЯ
========================================================= */

function goHome(){

    window.location.href = "index.html";

}


/* =========================================================
   ЗАЩИТА HTML
========================================================= */

function escapeHtml(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   ОТРИСОВКА
========================================================= */

function render(html){

    document.getElementById("game").innerHTML = html;

}


/* =========================================================
   ЗАПУСК
========================================================= */

start();

</script>

</body>
</html>
