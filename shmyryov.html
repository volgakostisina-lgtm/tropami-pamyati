<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Тропа Шмырёва · Тропами памяти</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    background: #101512;
    color: #f1eadc;
}

/* =========================
   ИГРА
========================= */

.game {
    min-height: 100vh;

    background-image:
        linear-gradient(
            rgba(7, 12, 10, 0.48),
            rgba(7, 12, 10, 0.68)
        ),
        url("shmyryov-background.png"),
        url("main-background.png");

    background-size: cover;
    background-position: center;
    background-attachment: fixed;

    position: relative;

    padding-bottom: 50px;
}

/* =========================
   ВЕРХНЯЯ ПАНЕЛЬ
========================= */

.topbar {
    position: fixed;

    top: 0;
    left: 0;
    right: 0;

    height: 54px;

    display: flex;
    justify-content: flex-end;
    align-items: center;

    gap: 8px;

    padding: 0 14px;

    background: rgba(8, 12, 10, 0.78);

    border-bottom: 1px solid rgba(235,225,205,0.15);

    z-index: 20;
}

.top-button {
    padding: 9px 14px;

    border: 1px solid rgba(235,225,205,0.25);

    background: rgba(15,20,17,0.75);

    color: #eee5d4;

    font-family: Georgia, "Times New Roman", serif;

    font-size: 14px;

    cursor: pointer;

    transition: 0.2s;
}

.top-button:hover {
    background: rgba(65,62,48,0.85);

    border-color: rgba(235,225,205,0.55);
}

/* =========================
   ОСНОВНАЯ ОБЛАСТЬ
========================= */

.main {
    width: min(1170px, 94%);

    margin: 0 auto;

    padding-top: 85px;
}

/* =========================
   СЦЕНА
========================= */

.scene {
    background: rgba(8,13,11,0.82);

    border: 1px solid rgba(225,215,194,0.25);

    box-shadow:
        0 20px 60px rgba(0,0,0,0.4);

    padding: 40px 40px 45px;

    min-height: 600px;

    animation: appear 0.5s ease;
}

@keyframes appear {

    from {
        opacity: 0;
        transform: translateY(12px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

/* =========================
   ТЕКСТ
========================= */

.chapter {
    font-size: 14px;

    letter-spacing: 4px;

    text-transform: uppercase;

    color: #cbbd9f;

    margin-bottom: 18px;
}

h1 {
    margin: 0 0 22px;

    font-size: clamp(34px, 5vw, 60px);

    font-weight: normal;

    color: #f1e7d3;

    line-height: 1.08;

    text-shadow:
        0 3px 14px rgba(0,0,0,0.7);
}

h2 {
    margin: 0 0 22px;

    font-size: clamp(28px, 4vw, 46px);

    font-weight: normal;

    color: #eee2cb;
}

h3 {
    margin-top: 35px;

    color: #d8c8a9;

    font-weight: normal;

    letter-spacing: 1px;
}

.text {
    max-width: 980px;

    font-size: 20px;

    line-height: 1.8;

    color: #eee7da;

    margin-bottom: 24px;
}

.small-text {
    font-size: 16px;

    line-height: 1.7;

    color: #cfc6b7;
}

/* =========================
   ЦИТАТА
========================= */

.quote {
    margin: 30px 0;

    padding: 22px 28px;

    border-left: 3px solid #b8a67d;

    background: rgba(20,25,22,0.7);

    color: #eee5d5;

    font-size: 20px;

    line-height: 1.7;
}

/* =========================
   ИНФО-КАРТОЧКА
========================= */

.info-card {
    margin: 28px 0;

    padding: 24px 28px;

    background: rgba(39,39,31,0.65);

    border: 1px solid rgba(222,210,183,0.2);
}

.info-title {
    font-size: 15px;

    letter-spacing: 2px;

    text-transform: uppercase;

    color: #c7b896;

    margin-bottom: 12px;
}

/* =========================
   КНОПКИ
========================= */

.buttons {
    margin-top: 35px;

    display: flex;

    flex-wrap: wrap;

    gap: 14px;
}

.choice {
    flex: 1;

    min-width: 260px;

    padding: 18px 22px;

    background: rgba(22,27,24,0.92);

    border: 1px solid rgba(232,222,201,0.3);

    color: #f1e8d8;

    font-family: Georgia, "Times New Roman", serif;

    font-size: 17px;

    line-height: 1.5;

    cursor: pointer;

    transition:
        transform 0.2s,
        background 0.2s,
        border-color 0.2s;
}

.choice:hover {
    transform: translateY(-3px);

    background: rgba(53,51,41,0.95);

    border-color: rgba(235,225,205,0.65);
}

.continue {
    display: inline-block;

    margin-top: 30px;

    padding: 16px 28px;

    background: rgba(69,65,49,0.9);

    border: 1px solid rgba(232,222,201,0.55);

    color: #f4ead7;

    font-family: Georgia, "Times New Roman", serif;

    font-size: 17px;

    letter-spacing: 1px;

    cursor: pointer;

    transition: 0.2s;
}

.continue:hover {
    transform: translateY(-2px);

    background: rgba(84,78,58,0.95);
}

/* =========================
   ДОСЬЕ
========================= */

.dossier {
    background: rgba(10,15,12,0.96);

    border: 1px solid rgba(225,215,194,0.3);

    padding: 35px;

    margin-top: 20px;
}

.dossier-title {
    font-size: 30px;

    color: #eee2ca;

    margin-bottom: 8px;
}

.dossier-note {
    color: #bdb4a4;

    margin-bottom: 28px;

    line-height: 1.6;
}

.field {
    margin-bottom: 18px;
}

.field label {
    display: block;

    margin-bottom: 7px;

    color: #d2c4a8;

    font-size: 15px;

    letter-spacing: 1px;
}

.field input,
.field select {
    width: 100%;

    padding: 12px 14px;

    background: rgba(29,33,29,0.95);

    border: 1px solid rgba(222,211,188,0.25);

    color: #eee7da;

    font-family: Georgia, "Times New Roman", serif;

    font-size: 16px;
}

.field input:focus,
.field select:focus {
    outline: none;

    border-color: rgba(225,210,174,0.65);
}

/* =========================
   ДНЕВНИК
========================= */

.diary {
    margin-top: 30px;

    padding: 25px;

    background: rgba(26,29,25,0.85);

    border: 1px solid rgba(225,215,194,0.18);
}

.diary-title {
    color: #cbbd9f;

    letter-spacing: 2px;

    text-transform: uppercase;

    font-size: 14px;

    margin-bottom: 15px;
}

.diary-entry {
    color: #ded6c8;

    line-height: 1.7;

    margin-bottom: 14px;

    padding-bottom: 14px;

    border-bottom: 1px solid rgba(225,215,194,0.1);
}

/* =========================
   ИСТОРИЧЕСКАЯ СПРАВКА
========================= */

.history {
    margin-top: 30px;

    background: rgba(36,37,29,0.82);

    border: 1px solid rgba(225,215,194,0.25);

    padding: 30px;
}

.history-title {
    font-size: 15px;

    letter-spacing: 3px;

    color: #cbbb9a;

    text-transform: uppercase;

    margin-bottom: 15px;
}

.history p {
    font-size: 17px;

    line-height: 1.75;

    color: #e2dbcf;
}

/* =========================
   ФИНАЛ
========================= */

.final {
    margin-top: 35px;

    padding: 35px;

    text-align: center;

    background: rgba(21,25,21,0.92);

    border: 1px solid rgba(225,215,194,0.28);
}

.final h2 {
    margin-bottom: 20px;
}

.final-text {
    font-size: 21px;

    line-height: 1.8;

    color: #e8dfcf;
}

/* =========================
   АДАПТАЦИЯ
========================= */

@media (max-width: 700px) {

    .main {
        width: 96%;

        padding-top: 70px;
    }

    .scene {
        padding: 27px 20px 32px;
    }

    .topbar {
        justify-content: center;
    }

    .top-button {
        font-size: 12px;

        padding: 8px 10px;
    }

    .text {
        font-size: 18px;
    }

    .choice {
        min-width: 100%;
    }

}

</style>
</head>


<body>

<div class="game">

    <!-- ВЕРХНЯЯ ПАНЕЛЬ -->

    <div class="topbar">

        <button class="top-button" onclick="showDossier()">
            📜 ДОСЬЕ
        </button>

        <button class="top-button" onclick="showDiary()">
            📖 ДНЕВНИК
        </button>

        <button class="top-button" onclick="goHome()">
            🏠 ГЛАВНАЯ
        </button>

    </div>


    <main class="main">

        <section class="scene" id="scene">

        </section>

    </main>

</div>


<script>

/* =========================================================
   СОСТОЯНИЕ ИГРЫ
========================================================= */

let game = {
    chapter: 0,

    dossier: null,

    choice: null,

    diary: [],

    childrenChoice: false,

    detachmentChoice: false
};


/* =========================================================
   ЗАГРУЗКА
========================================================= */

const saved = localStorage.getItem("shmyryovGame");

if (saved) {

    try {

        const loaded = JSON.parse(saved);

        game = {
            ...game,
            ...loaded
        };

    } catch (e) {

        console.log("Не удалось загрузить сохранение.");

    }

}


/* =========================================================
   СОХРАНЕНИЕ
========================================================= */

function saveGame() {

    localStorage.setItem(
        "shmyryovGame",
        JSON.stringify(game)
    );

}


/* =========================================================
   ЭКРАН
========================================================= */

function render(html) {

    const scene = document.getElementById("scene");

    scene.innerHTML = html;

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================================================
   ГЛАВНАЯ
========================================================= */

function goHome() {

    window.location.href = "index.html";

}


/* =========================================================
   ПРОЛОГ
========================================================= */

function startGame() {

    game.chapter = 0;

    saveGame();

    renderPrologue();

}


function renderPrologue() {

    render(`

        <div class="chapter">
            ПРОЛОГ
        </div>

        <h1>
            Суражский район
        </h1>

        <div class="text">
            Июль 1941 года.
        </div>

        <div class="text">
            Война пришла в Беларусь совсем недавно.
            Привычная жизнь рушится на глазах.
            Люди пытаются понять, что делать дальше.
        </div>

        <div class="text">
            Кто-то уходит в лес.
            Кто-то остаётся рядом с домом.
            Кто-то пытается сохранить связь с теми,
            кто оказался далеко.
        </div>

        <div class="text">
            В Суражском районе формируется
            партизанский отряд под руководством
            <strong>Миная Филипповича Шмырёва.</strong>
        </div>

        <div class="quote">
            Но помни: ты — вымышленный участник событий.
            История М. Ф. Шмырёва и его семьи
            остаётся историей реальных людей.
        </div>

        <button class="continue" onclick="showDossier()">
            ПРОДОЛЖИТЬ →
        </button>

    `);

}


/* =========================================================
   ДОСЬЕ
========================================================= */

function showDossier() {

    if (game.dossier) {

        renderExistingDossier();

        return;

    }

    render(`

        <div class="chapter">
            ЛИЧНОЕ ДОСЬЕ
        </div>

        <h2>
            Заполни досье своего героя
        </h2>

        <div class="dossier">

            <div class="dossier-note">
                Используй вымышленные данные —
                это часть игры.
            </div>


            <div class="field">

                <label>
                    Имя
                </label>

                <input
                    id="firstName"
                    placeholder="Например: Иван"
                >

            </div>


            <div class="field">

                <label>
                    Фамилия
                </label>

                <input
                    id="lastName"
                    placeholder="Например: Петров"
                >

            </div>


            <div class="field">

                <label>
                    Возраст
                </label>

                <input
                    id="age"
                    type="number"
                    min="14"
                    max="70"
                    placeholder="Например: 16"
                >

            </div>


            <div class="field">

                <label>
                    Родной город или деревня
                </label>

                <input
                    id="place"
                    placeholder="Вымышленное место"
                >

            </div>


            <div class="field">

                <label>
                    Район / область
                </label>

                <input
                    id="district"
                    placeholder="Например: Витебская область"
                >

            </div>


            <div class="field">

                <label>
                    Имя близкого человека
                </label>

                <input
                    id="relative"
                    placeholder="Вымышленное имя"
                >

            </div>


            <div class="field">

                <label>
                    Кем он тебе приходится?
                </label>

                <input
                    id="relation"
                    placeholder="Например: сестра"
                >

            </div>


            <div class="field">

                <label>
                    Как тебя узнать?
                </label>

                <input
                    id="mark"
                    placeholder="Особая примета"
                >

            </div>


            <div class="field">

                <label>
                    Под каким именем тебя знают товарищи?
                </label>

                <input
                    id="code"
                    placeholder="Кодовое имя"
                >

            </div>


            <button
                class="continue"
                onclick="saveDossier()"
            >
                💾 СОХРАНИТЬ ДОСЬЕ
            </button>

        </div>

    `);

}


/* =========================================================
   СОХРАНЕНИЕ ДОСЬЕ
========================================================= */

function saveDossier() {

    const firstName =
        document.getElementById("firstName").value.trim();

    const lastName =
        document.getElementById("lastName").value.trim();

    const age =
        document.getElementById("age").value.trim();

    const place =
        document.getElementById("place").value.trim();

    const district =
        document.getElementById("district").value.trim();

    const relative =
        document.getElementById("relative").value.trim();

    const relation =
        document.getElementById("relation").value.trim();

    const mark =
        document.getElementById("mark").value.trim();

    const code =
        document.getElementById("code").value.trim();


    if (
        !firstName ||
        !lastName ||
        !age ||
        !place ||
        !district ||
        !relative ||
        !relation ||
        !mark ||
        !code
    ) {

        alert("Заполни, пожалуйста, все поля досье.");

        return;

    }


    game.dossier = {

        firstName,
        lastName,
        age,
        place,
        district,
        relative,
        relation,
        mark,
        code

    };


    game.diary.push(
        "Июль 1941 года. Моё досье принято. Теперь начинается мой путь."
    );


    saveGame();

    showDossierAccepted();

}


/* =========================================================
   ДОСЬЕ ПРИНЯТО
========================================================= */

function showDossierAccepted() {

    render(`

        <div class="chapter">
            ДОСЬЕ ПРИНЯТО
        </div>

        <h1>
            ${game.dossier.code}
        </h1>

        <div class="text">
            Товарищ
            <strong>
                ${game.dossier.firstName}
                ${game.dossier.lastName}
            </strong>,
            твоё досье сохранено.
        </div>

        <div class="quote">
            Война не знает заранее,
            какой выбор придётся сделать человеку.
        </div>

        <div class="text">
            Но иногда история ставит человека
            перед выбором, от которого
            невозможно просто отвернуться.
        </div>

        <button
            class="continue"
            onclick="chapter1()"
        >
            НАЧАТЬ ИСТОРИЮ →
        </button>

    `);

}


/* =========================================================
   ЕСЛИ ДОСЬЕ УЖЕ ЕСТЬ
========================================================= */

function renderExistingDossier() {

    render(`

        <div class="chapter">
            ЛИЧНОЕ ДОСЬЕ
        </div>

        <h2>
            ${game.dossier.code}
        </h2>

        <div class="dossier">

            <div class="small-text">

                <p>
                    <strong>Имя:</strong>
                    ${game.dossier.firstName}
                    ${game.dossier.lastName}
                </p>

                <p>
                    <strong>Возраст:</strong>
                    ${game.dossier.age}
                </p>

                <p>
                    <strong>Родной край:</strong>
                    ${game.dossier.place},
                    ${game.dossier.district}
                </p>

                <p>
                    <strong>Близкий человек:</strong>
                    ${game.dossier.relative}
                    (${game.dossier.relation})
                </p>

                <p>
                    <strong>Особая примета:</strong>
                    ${game.dossier.mark}
                </p>

                <p>
                    <strong>Кодовое имя:</strong>
                    ${game.dossier.code}
                </p>

            </div>


            <button
                class="continue"
                onclick="continueGame()"
            >
                ПРОДОЛЖИТЬ ИСТОРИЮ →
            </button>

        </div>

    `);

}


/* =========================================================
   ПРОДОЛЖЕНИЕ
========================================================= */

function continueGame() {

    switch (game.chapter) {

        case 0:
            chapter1();
            break;

        case 1:
            chapter2();
            break;

        case 2:
            chapter3();
            break;

        case 3:
            chapter4();
            break;

        case 4:
            chapter5();
            break;

        case 5:
            chapter6();
            break;

        case 6:
            chapter7();
            break;

        case 7:
            historicalPart();
            break;

        default:
            chapter1();

    }

}


/* =========================================================
   ГЛАВА I
========================================================= */

function chapter1() {

    game.chapter = 1;

    saveGame();

    render(`

        <div class="chapter">
            ГЛАВА I
        </div>

        <h1>
            Лес становится ближе
        </h1>

        <div class="text">
            Июль 1941 года.
        </div>

        <div class="text">
            С каждым днём становится понятнее:
            война — это не только сообщения
            с фронта.
        </div>

        <div class="text">
            Она приходит в деревни,
            на дороги, в дома.
            Она заставляет людей
            принимать решения,
            которых ещё недавно
            никто не представлял.
        </div>

        <div class="text">
            В Суражском районе собираются люди,
            готовые сопротивляться.
        </div>

        <div class="text">
            Их возглавляет
            <strong>Минай Филиппович Шмырёв.</strong>
        </div>

        <div class="info-card">

            <div class="info-title">
                ИСТОРИЧЕСКИЙ КОНТЕКСТ
            </div>

            <div class="small-text">
                В июле 1941 года в Суражском районе
                был сформирован партизанский отряд
                под руководством М. Ф. Шмырёва.
            </div>

        </div>

        <div class="text">
            Тебе предстоит находиться рядом
            с историческими событиями,
            но твой герой остаётся вымышленным.
        </div>

        <button
            class="continue"
            onclick="chapter2()"
        >
            ДАЛЬШЕ →
        </button>

    `);

}


/* =========================================================
   ГЛАВА II
========================================================= */

function chapter2() {

    game.chapter = 2;

    game.diary.push(
        "Мы вошли в лес. Здесь всё непривычно: тишина, дороги, незнакомые люди."
    );

    saveGame();

    render(`

        <div class="chapter">
            ГЛАВА II
        </div>

        <h1>
            Первые дни
        </h1>

        <div class="text">
            В лесу всё кажется непривычным.
        </div>

        <div class="text">
            Нет привычных улиц.
            Нет расписания.
            Нет уверенности в том,
            что будет завтра.
        </div>

        <div class="text">
            Есть только люди,
            которым приходится
            учиться доверять друг другу.
        </div>

        <div class="text">
            Шмырёв внимательно разговаривает
            с людьми, проверяет сведения,
            распределяет обязанности.
        </div>

        <div class="quote">
            В сопротивлении важно не только
            быть смелым.
            Важно уметь думать о других.
        </div>

        <div class="text">
            Один из товарищей сообщает,
            что неподалёку замечены незнакомые люди.
            Нужно понять, действительно ли
            это опасность.
        </div>

        <div class="buttons">

            <button
                class="choice"
                onclick="chapter3()"
            >
                🔎
                Проверить сведения
                и сначала понять,
                что произошло
            </button>


            <button
                class="choice"
                onclick="chapter3()"
            >
                👥
                Предупредить товарищей
                и действовать
                осторожнее
            </button>

        </div>

    `);

}


/* =========================================================
   ГЛАВА III
========================================================= */

function chapter3() {

    game.chapter = 3;

    game.diary.push(
        "Сегодня я понял(а), что любая ошибка может повлиять не только на тебя."
    );

    saveGame();

    render(`

        <div class="chapter">
            ГЛАВА III
        </div>

                Пройди несколько сцен истории —

        game.diary.forEach((entry, index) => {

            entries += `

            `;

        });

    }


    render(`

        <div class="chapter">

}
